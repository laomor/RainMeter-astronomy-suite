name: Update Sun & Moon Data

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Config and Paths
        shell: pwsh
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
          BAIDU_KEY: ${{ secrets.BAIDU_AK }}
        run: |
          # 1. 写入密钥
          $config = @{
              weatherApiKey = "$env:WEATHER_KEY"
              baiduAk = "$env:BAIDU_KEY"
          } | ConvertTo-Json
          Set-Content -Path "./Users Public Documents/WeatherApiKeys.json" -Value $config

          # 2. 读取并修改脚本
          $scriptPath = "./Users Public Documents/AstronomicalEvents.ps1"
          $content = Get-Content $scriptPath -Raw
          
          # 替换输出路径为当前仓库的 Event Time Case
          $content = $content.Replace('$publicDocuments = "C:\Users\Public\Documents\Rainmeter Data"', '$publicDocuments = Join-Path (Get-Location) "Event Time Case"')
          
          # 替换错误日志路径为当前目录
          $content = $content.Replace('$errorLogPath = Join-Path ([Environment]::GetFolderPath("Desktop")) "SunMoonDataError.log"', '$errorLogPath = Join-Path (Get-Location) "SunMoonDataError.log"')

          # 【核心】彻底阉割公网IP定位逻辑，强制指定为北京 (101010100)，避免海外服务器定位报错
          $content = $content -replace '(?s)function Get-CityCode \{.*?return \$cityCode\s*\}', 'function Get-CityCode { return "101010100" }'
          
          Set-Content -Path $scriptPath -Value $content

      - name: Run Astronomical Events Script
        shell: pwsh
        run: |
          # 使用 pwsh -File 的形式执行，并捕获所有输出
          Write-Host "==== 开始执行 ===="
          try {
              pwsh -File "Users Public Documents/AstronomicalEvents.ps1"
          } catch {
              Write-Host "❌ 脚本执行失败: $_" -ForegroundColor Red
          }
          Write-Host "==== 执行结束，检查文件 ===="
          if (Test-Path "Event Time Case") {
              Get-ChildItem "Event Time Case" | Select-Object Name, Length | Format-Table
          } else {
              Write-Host "❌ 未找到 Event Time Case 文件夹！"
          }

      # 无论成功失败，强制生成一个状态文件，防止无内容提交被跳过
      - name: Force Generate Status File
        run: |
          date -u > Event_Time_Case_Status.txt
          if [ -f "SunMoonDataError.log" ]; then
            echo "=== 发现错误日志 ===" >> Event_Time_Case_Status.txt
            cat "SunMoonDataError.log" >> Event_Time_Case_Status.txt
          fi

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update data or log status"
          file_pattern: 'Event Time Case/*.txt SunMoonDataError.log Event_Time_Case_Status.txt'
