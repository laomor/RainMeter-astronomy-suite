name: Update Sun & Moon Data

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点运行
  workflow_dispatch: # 支持手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell
        run: |
          # 确保使用 pwsh
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Prepare Config and Paths
        shell: pwsh
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
          BAIDU_KEY: ${{ secrets.BAIDU_AK }}
        run: |
          # 1. 动态生成 WeatherApiKeys.json (使用 Secrets 中的密钥)
          $config = @{
              weatherApiKey = $env:WEATHER_KEY
              baiduAk = $env:BAIDU_KEY
          } | ConvertTo-Json
          Set-Content -Path "Users Public Documents/WeatherApiKeys.json" -Value $config

          # 2. 修改脚本中的输出路径 (将 C:\... 替换为当前仓库目录)
          $scriptPath = "Users Public Documents/AstronomicalEvents.ps1"
          $content = Get-Content $scriptPath -Raw
          # 替换为动态获取当前脚本所在目录
          $content = $content -replace '\$publicDocuments = "C:\\Users\\Public\\Documents\\Rainmeter Data"', '$publicDocuments = Join-Path (Get-Location) "Event Time Case"'
          # 移除写死桌面错误日志的路径，改为当前目录
          $content = $content -replace '\$errorLogPath = Join-Path \(\[Environment\]::GetFolderPath\("Desktop"\)\) "SunMoonDataError.log"', '$errorLogPath = Join-Path (Get-Location) "SunMoonDataError.log"'
          Set-Content -Path $scriptPath -Value $content

      - name: Run Astronomical Events Script
        shell: pwsh
        run: |
          # 执行修改后的脚本
          ./"Users Public Documents/AstronomicalEvents.ps1"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sun & moon data"
          file_pattern: 'Event Time Case/*.txt'
