name: Update Sun & Moon Data

on:
  schedule:
    - cron: '02 1 * * *' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Prepare Config and Paths
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
          BAIDU_KEY: ${{ secrets.BAIDU_AK }}
        run: |
          # 1. 生成 json 配置文件
          echo "{" > "Users Public Documents/WeatherApiKeys.json"
          echo "  \"weatherApiKey\": \"$WEATHER_KEY\"," >> "Users Public Documents/WeatherApiKeys.json"
          echo "  \"baiduAk\": \"$BAIDU_KEY\"" >> "Users Public Documents/WeatherApiKeys.json"
          echo "}" >> "Users Public Documents/WeatherApiKeys.json"

          # 2. 修改输出路径和城市代码
          sed -i 's|\$publicDocuments = "C:\\Users\\Public\\Documents\\Rainmeter Data"|\$publicDocuments = "./Event Time Case"|g' "Users Public Documents/AstronomicalEvents.ps1"
          sed -i 's|function Get-CityCode {|function Get-CityCode { return "101010100";|g' "Users Public Documents/AstronomicalEvents.ps1"

      - name: Run Astronomical Events Script
        shell: pwsh
        env:
          TZ: Asia/Shanghai   # <--- 这里是新增的时区设置
        run: |
          # 执行脚本
          ./"Users Public Documents/AstronomicalEvents.ps1"

      # 【关键修复】恢复被修改的 ps1 脚本，防止它被提交到仓库
      - name: Revert Script Changes
        run: |
          git checkout "Users Public Documents/AstronomicalEvents.ps1"

      # 【关键修复】使用原生 Git 提交，只提交 txt 文件，忽略不存在的日志文件
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只添加 Event Time Case 下的 txt 文件
          git add "Event Time Case/*.txt"
          
          # 如果文件有变化就提交，没变化就静默跳过，防止报错
          git commit -m "chore: auto-update sun & moon data" || echo "No changes to commit"
          
          # 推送到仓库
          git push
