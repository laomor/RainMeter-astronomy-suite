name: Update Sun & Moon Data

on:
  schedule:
    # 每天 UTC 0点 (北京时间早上8点) 运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在Actions页面手动点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Config and Paths
        shell: pwsh
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
          BAIDU_KEY: ${{ secrets.BAIDU_AK }}
        run: |
          # 1. 动态生成 WeatherApiKeys.json
          $config = @{
              weatherApiKey = $env:WEATHER_KEY
              baiduAk = $env:BAIDU_KEY
          } | ConvertTo-Json
          Set-Content -Path "Users Public Documents/WeatherApiKeys.json" -Value $config

          # 2. 读取并修改 PowerShell 脚本
          $scriptPath = "Users Public Documents/AstronomicalEvents.ps1"
          $content = Get-Content $scriptPath -Raw
          
          # 替换输出路径 (使用纯字符串替换，避免正则转义)
          $oldPath = '$publicDocuments = "C:\Users\Public\Documents\Rainmeter Data"'
          $newPath = '$publicDocuments = Join-Path (Get-Location) "Event Time Case"'
          $content = $content.Replace($oldPath, $newPath)
          
          # 替换错误日志路径
          $oldLog = '$errorLogPath = Join-Path ([Environment]::GetFolderPath("Desktop")) "SunMoonDataError.log"'
          $newLog = '$errorLogPath = Join-Path (Get-Location) "SunMoonDataError.log"'
          $content = $content.Replace($oldLog, $newLog)

          # 3. 在脚本末尾强制追加一句，生成时间戳文件（确保每次都有文件更新，触发 Commit）
          $timestampCode = "`n`nSet-Content -Path (Join-Path `$publicDocuments 'LastUpdate.txt') -Value `"Updated at `$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC`""
          $content = $content + $timestampCode

          # 保存修改后的脚本
          Set-Content -Path $scriptPath -Value $content

      - name: Run Astronomical Events Script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              ./"Users Public Documents/AstronomicalEvents.ps1"
          } catch {
              Write-Error "Script failed: $_"
              exit 1
          }

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sun & moon data"
          # 包含 txt 文件和生成的 LastUpdate 文件
          file_pattern: 'Event Time Case/*.txt'
