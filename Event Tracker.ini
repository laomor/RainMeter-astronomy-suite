[Rainmeter]
Update=1000
Background=#@#Background_double.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=SunMoonTracker
Author=Your Name
Information=Scrolling display of the rise and fall events of the sun and moon over a period of time, with the current time as the center.
License=Creative Commons BY-NC-SA 3.0
Version=6.0

[Variables]
;<<Celestial Icon>>
Mark=#@#Tracker_mark.png
SunIcon=#@#Tracker_sun.png
MoonIcon=#@#Tracker_moon.png

;<<Celestial icon size>>
IconSize=21

;<<Horizon Color>>
HorizonColor=128,128,128,128

;<<Celestial body color>>
SunColor=255,215,0,255
MoonColor=30,144,255,255
 
;<<Event marker color>>
SunEventColor=255,215,0,180
MoonEventColor=30,144,255,180

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=255,255,255,205
FontFace=Trebuchet MS
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,160
FontFace=Trebuchet MS
FontSize=8
AntiAlias=1
ClipString=1

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%Y%m%d%H%M
UpdateDivider=1

[MeasureLua]
Measure=Script
ScriptFile=#@#Event Tracker.lua
UpdateDivider=60
SunFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
MoonFile=C:\Users\Public\Documents\Rainmeter Data\MoonTimeStampEvent.txt

;<<Skin height>>  <<Icon size>>
SkinWidth=420
SkinHeight=256
IconSize=#IconSize#

;<<Optional: override default container height>>
;ContainerH=55

;<<Timeline length>> 
Length=360
;<<The number of seconds represented by each pixel>>
SecondPerPixel=480
;<<Time offset in pixels from timeline start to current time (default 24 = 6 hours at 900 sec/pixel)>>
TimeOffsetInPixels=60

;<<The height difference (in pixels) between the dynamic high and low points of day and night duration and the reference point>>
OffsetValue=15

; =================================
; MEASURES
; =================================

[MeasureContainerX]
Measure=String
String=[MeasureLua:GetContainerX()]
DynamicVariables=1

[MeasureContainerY]
Measure=String
String=[MeasureLua:GetContainerY()]
DynamicVariables=1

[MeasureContainerW]
Measure=String
String=[MeasureLua:GetContainerW()]
DynamicVariables=1

[MeasureContainerH]
Measure=String
String=[MeasureLua:GetContainerH()]
DynamicVariables=1

; =================================
; MEASURES
; =================================

[MeasureHorizonY]
Measure=String
String=[MeasureLua:GetHorizonY()]
DynamicVariables=1

[MeasureXAxisStart]
Measure=String
String=[MeasureLua:GetXAxisStart()]
DynamicVariables=1

[MeasureLength]
Measure=String
String=[MeasureLua:GetLength()]
DynamicVariables=1

; =================================
; MEASURES
; =================================

[MeasureSunX]
Measure=String
String=[MeasureLua:GetSunX()]
DynamicVariables=1

[MeasureSunY]
Measure=String
String=[MeasureLua:GetSunY()]
DynamicVariables=1

[MeasureMoonX]
Measure=String
String=[MeasureLua:GetMoonX()]
DynamicVariables=1

[MeasureMoonY]
Measure=String
String=[MeasureLua:GetMoonY()]
DynamicVariables=1

[SunState]
Measure=String
String=[MeasureLua:GetSunState()]
DynamicVariables=1

[MoonState]
Measure=String
String=[MeasureLua:GetMoonState()]
DynamicVariables=1

; =================================
; MEASURES
; =================================

; Sun events position
[MeasureSunEvent1]
