; =================================
; METERS
; =================================

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=210
Y=12
W=180
H=18
Text="Sun Moon Tracker"

[MeterSunLabel]
Meter=String
MeterStyle=StyleCenterText
X=390
Y=16
W=10
H=10
Text=S
MouseOverAction=[!HideMeterGroup "TimeRange"][!HideMeterGroup "MoonEvent"][!ShowMeterGroup "SunTimes"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "TimeRange"][!ShowMeterGroup "MoonEvent"][!HideMeterGroup "SunTimes"][!Redraw]

[MeterMoonLabel]
Meter=String
MeterStyle=StyleCenterText
X=402
Y=16
W=10
H=10
Text=M
MouseOverAction=[!HideMeterGroup "TimeRange"][!HideMeterGroup "SunEvent"][!ShowMeterGroup "MoonTimes"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "TimeRange"][!ShowMeterGroup "SunEvent"][!HideMeterGroup "MoonTimes"][!Redraw]

; =================================
; METERS
; =================================

[MeterContainer]
Meter=Image
X=[MeasureContainerX]
Y=[MeasureContainerY]
W=[MeasureContainerW]
H=[MeasureContainerH]
SolidColor=255,255,255,255
DynamicVariables=1

[HorizonLine]
Meter=Image
X=([MeasureXAxisStart]-(#IconSize#-1)/2)
Y=[MeasureHorizonY]
W=([MeasureLength]+(#IconSize#-1))
H=1
SolidColor=#HorizonColor#
Container=MeterContainer
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterSun]
Meter=Image
ImageName=#SunIcon#
ImageTint=#SunColor#
X=([MeasureSunX]-(#IconSize#-1)/2)
Y=([MeasureSunY]-(#IconSize#-1)/2)
W=#IconSize#
H=#IconSize#
Container=MeterContainer
Group=SunEvent
DynamicVariables=1
MouseOverAction=[!HideMeterGroup "TimeRange"][!ShowMeterGroup "SunTimes"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "TimeRange"][!HideMeterGroup "SunTimes"][!Redraw]

[MeterMoon]
Meter=Image
ImageName=#MoonIcon#
ImageTint=#MoonColor#
X=([MeasureMoonX]-(#IconSize#-1)/2)
Y=([MeasureMoonY]-(#IconSize#-1)/2)
W=#IconSize#
H=#IconSize#
Container=MeterContainer
Group=MoonEvent
DynamicVariables=1
MouseOverAction=[!HideMeterGroup "TimeRange"][!ShowMeterGroup "MoonTimes"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "TimeRange"][!HideMeterGroup "MoonTimes"][!Redraw]

[MeterSunState]
Meter=String
MeterStyle=StyleCenterText
MeasureName=SunState
X=([MeasureXAxisStart]+[MeasureLength])
Y=0
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=SunTimes
DynamicVariables=1

[MeterMoonState]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MoonState
X=([MeasureXAxisStart]+[MeasureLength])
Y=0
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=MoonTimes
DynamicVariables=1

