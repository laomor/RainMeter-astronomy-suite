DynamicVariables=1

; Sun events time
[MeasureSunEventTime1]
Measure=String
String=[MeasureLua:GetSunEventTime1()]
DynamicVariables=1

[MeasureSunEventTime2]
Measure=String
String=[MeasureLua:GetSunEventTime2()]
