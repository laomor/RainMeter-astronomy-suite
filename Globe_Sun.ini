[Rainmeter]
Update=1000
Background=#@#Background_double.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=EarthRotation
Author=YourName
Information=Simulate the real-time rotation of the Earth.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
ImagePath=#@#Globe\
fontName=Trebuchet MS
colorText=255,255,255,205
colorBar=235,170,0,255
height=344
textSize=8

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleSeperator]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,36

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%Y-%m-%d %H:%M:%S
UpdateDivider=1

[MeasureLua]
Measure=Script
ScriptFile=#@#Globe.lua
UpdateDivider=60
CalculateFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
LocalLongitude=114
BodyType=Sun

[MeasureTimeStatus]
Measure=String
String=[MeasureLua:GetTimeStatus()]
DynamicVariables=1

[MeasureEarthImage]
Measure=String
String=[MeasureLua:GetEarthImage()]
DynamicVariables=1
UpdateDivider=10
RegExpSubstitute=1
Substitute="^(\d+)$":"globe_\1","^(\d{1,2})$":"globe_00\1","^(\d{1,3})$":"globe_\1","^globe_(\d{1})$":"globe_00\1","^globe_(\d{2})$":"globe_0\1"

[MeasureTimeRatioT]
Measure=String
String=[MeasureLua:GetCurrentTimeRatioT()]
DynamicVariables=1
NumOfDecimals=3

[MeasureCalculateLongitude]
Measure=String
String=[MeasureLua:GetCurrentCalculateLongitude()]
DynamicVariables=1
NumOfDecimals=1

[MeasureLocalLongitude]
Measure=String
String=[MeasureLua:GetLocalLongitude()]
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=210
Y=12
W=190
H=18
Text="Earth Rotation"

[MeterEarthDay]
Meter=Image
ImageName=#ImagePath#[MeasureEarthImage].png
X=(420-(#height#-64))/2
Y=40
W=(#height#-64)
H=(#height#-64)
ToolTipText="[MeasureTimeStatus] : [MeasureEarthImage]"
PreserveAspectRatio=1
DynamicVariables=1
AntiAlias=1

[MeterInformation]
Meter=String
MeterStyle=StyleRightText
X=410
Y=(#height#-36)
W=380
H=14
Text="Sun:[MeasureCalculateLongitude]  Local:[MeasureLocalLongitude]"
DynamicVariables=1

[MeterStateTBar]
Meter=bar
MeterStyle=StyleSeperator
MeasureName=MeasureTimeRatioT
X=10
Y=(#height#-15)
W=400
H=1

[MeterClickArea]
Meter=Image
X=10
Y=39
W=400
H=(#height#-53)
SolidColor=0,0,0,1
LeftMouseUpAction=[!Refresh]
DynamicVariables=1