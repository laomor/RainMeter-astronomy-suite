<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Simulator · 位置模拟</title>
<style>
  :root{
    --sun:#FFD700;
    --moon:#1E90FF;
    --ink:rgba(255,255,255,.92);
    --ink-dim:rgba(255,255,255,.55);
    --warn:#f0a13a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#05070d;
    background-image:radial-gradient(120% 90% at 50% 0%, #131c33 0%, #05070d 62%);
    color:var(--ink);
    font-family:"Trebuchet MS","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
  .app{width:100%;max-width:660px;}
  .head{display:flex;align-items:baseline;gap:10px;margin:0 4px 14px;}
  .head h1{font-size:19px;margin:0;letter-spacing:.5px;}
  .head span{font-size:12px;color:var(--ink-dim);letter-spacing:.5px;}

  .stage{
    position:relative;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,#121c33 0%,#0a1120 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:auto;}

  .bar{
    display:flex;align-items:center;gap:10px;
    margin-top:16px;
    padding:0 2px;
  }
  .btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    color:var(--ink);
    border-radius:8px;
    height:34px;
    padding:0 13px;
    font:inherit;font-size:13px;
    cursor:pointer;
  }
  .btn:hover{background:rgba(255,255,255,.1);}
  .btn.primary{min-width:74px;}

  .scrub{
    -webkit-appearance:none;appearance:none;
    flex:1;height:4px;border-radius:2px;
    background:rgba(255,255,255,.14);
    outline:none;
  }
  .scrub::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--ink);border:none;cursor:pointer;
    box-shadow:0 0 0 1px rgba(0,0,0,.5);
  }
  .scrub::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--ink);
    border:none;cursor:pointer;
  }

  .clock{
    font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--ink-dim);
    white-space:nowrap;min-width:104px;text-align:right;
  }

  .readout{
    display:flex;gap:26px;flex-wrap:wrap;
    margin:14px 2px 0;
    font-size:12.5px;color:var(--ink-dim);
  }
  .readout b{color:var(--ink);font-weight:600;}
  .readout i{font-style:normal;font-variant-numeric:tabular-nums;}
  /* 观测点：两个输入框，和面板里的读数一一对应 */
  .obs{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:13px 2px 0;font-size:11.5px;color:var(--ink-dim);
  }
  .obs label{display:flex;align-items:center;gap:5px;}
  .obs input{
    width:68px;height:26px;padding:0 7px;
    border:1px solid rgba(255,255,255,.12);border-radius:6px;
    background:rgba(255,255,255,.05);color:var(--ink);
    font:inherit;font-size:12px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .obs input:focus{
    outline:none;
    border-color:rgba(255,215,0,.45);
    background:rgba(255,215,0,.07);
  }
  .obs-src{margin-left:auto;font-size:11px;color:rgba(255,255,255,.42);white-space:nowrap;}
  .obs-src.warn{color:rgba(240,161,58,.8);}

  .spd{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin:12px 2px 0;font-size:11px;color:rgba(255,255,255,.4);
  }
  .spd-b{
    appearance:none;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);
    border-radius:6px;height:24px;padding:0 9px;
    font:inherit;font-size:11px;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .spd-b:hover{background:rgba(255,255,255,.1);}
  .spd-b.on{
    border-color:rgba(255,215,0,.5);color:#FFD700;
    background:rgba(255,215,0,.09);
  }
  .note{
    margin:18px 4px 0;font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.38);
  }

  /* ——— 1280×800 全屏面板：画布铺满、去掉标题带、控件浮在底部 ——— */
  html,body{height:100%;margin:0;overflow:hidden;}
  body{display:block;padding:0;background:#05070d;}
  .app{position:fixed;inset:0;width:auto;max-width:none;}
  .stage{
    /* 让开底部控件条：原来 inset:0 会让画布比可用高度多出约 90px，
       下半截其实一直藏在控件条下面（−60° 以下全被吞掉）。 */
    /* 始终铺满整屏：底部那条控件条改成"压在天空上"。
       这样收起控件条时只是揭开一条本来就在画的天空，画布尺寸不变、图也不用重新适配。 */
    position:absolute;inset:0;
    border:0;border-radius:0;box-shadow:none;
    background:#070b14;
  }
  #cv{display:block;width:100%;height:100%;}
  /* 标记层：单独一张画布，压在读数卡之上。日月圆点永远看得见，不会被面板玻璃糊掉 */
  #mk{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;}

  /* ——— 读数卡：一块贴在天上的玻璃 ———
     层次自上而下收窄：状态词 26 > 高度 21 > 直射 16 > 升落 12.5 > 观测点 12.5/10.5。
     日月各配一个和画面同色的圆点，把卡和下面的图绑成一套。
     三列宽度收在变量里，行与下面缩进的附注共用同一份，改列宽只改一处。 */
  .info{
    --c1:46px; --c2:36px; --cg:9px;  --c4:50px;
    position:absolute;left:24px;top:22px;z-index:3;
    width:300px;padding:11px 14px 9px;
    background:linear-gradient(165deg, rgba(17,24,38,.82) 0%, rgba(8,12,20,.74) 100%);
    border:1px solid rgba(150,180,225,.13);
    border-radius:14px;
    box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);
    color:#8e97a5;font-size:11.5px;
    font-variant-numeric:tabular-nums;      /* 数字等宽，时刻跳秒也不会左右抖 */
    pointer-events:none;
  }
  /* 卡头：小字"此刻" + 青绿状态词，右端日子时辰贴着底边对齐 */
  .info .hd{display:flex;align-items:flex-end;gap:9px;padding-bottom:7px;}
  .info .kk{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.32);}
  .info .hd b{font-size:20px;line-height:1;letter-spacing:.8px;font-weight:700;color:#3ff0c0;}
  .info .hd .t{margin-left:auto;font-size:10.5px;letter-spacing:.4px;color:rgba(255,255,255,.48);}

  /* 主体行：谁 / 升还是降 / 高度 / 直射（靠右），四条竖线一眼到底 */
  .info .row{
    display:grid;grid-template-columns:var(--c1) var(--c2) 1fr var(--c4);
    column-gap:var(--cg);align-items:center;padding-top:6px;
  }
  .info .who{display:flex;align-items:center;gap:6px;font-size:12px;color:#e8edf5;letter-spacing:.3px;}
  .info .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .info .d-sun{background:#FFD700;box-shadow:0 0 9px rgba(255,215,0,.55);}
  .info .d-moon{background:#1E90FF;box-shadow:0 0 9px rgba(30,144,255,.55);}
  .info .st{font-size:11px;letter-spacing:.6px;color:rgba(255,255,255,.6);}

  /* 表头：高度 / 直射 的标签只在这里出现一次，数值行上不再挂小字。
     这样"太阳 上升 10.8° 172°"真的是一条线，左边不会短半行。 */
  .info .row.th2{padding-top:7px;padding-bottom:0;}
  /* 表头比数值小一半，字形边距也跟着差几个像素：左补 3px、右收 1.5px，
     让"高度"的左沿和 10.8 的左沿、"直射"的右沿和 172° 的右沿落在同一条竖线上 */
  .info .thk{padding-left:2.5px;font-size:9px;letter-spacing:1.2px;color:rgba(255,255,255,.28);}
  .info .thk.r{padding-left:0;padding-right:1.2px;text-align:right;}

  /* 数值块：一格只有一个数，靠字号分主次 */
  .info .stat b{font-size:17.5px;font-weight:600;color:#fff;letter-spacing:.2px;white-space:nowrap;}
  .info .stat.sm{text-align:right;}
  .info .stat.sm b{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.85);}

  /* 升落：一行附注，缩进对齐到"高度"那一列.
     三个槽位都定宽——标签 24、日期前缀 28、时分 38——所以前缀有无都不改变行宽 */
  .info .ev{
    padding:2px 0 0 calc(var(--c1) + var(--c2) + 2 * var(--cg));
    font-size:11px;color:rgba(255,255,255,.52);white-space:nowrap;
  }
  .info .ev .lb{display:inline-block;width:19px;font-size:9px;letter-spacing:.2px;color:rgba(255,255,255,.34);}
  .info .ev .d{display:inline-block;width:23px;text-align:right;font-size:9px;color:rgba(255,255,255,.34);}
  .info .ev b{display:inline-block;width:31px;padding-left:4px;font-size:11px;font-weight:500;color:rgba(255,255,255,.86);}
  .info .ev .sep{display:inline-block;width:15px;text-align:center;color:rgba(255,255,255,.2);}
  .info .ev .evn{font-size:10px;letter-spacing:.4px;color:rgba(255,255,255,.5);}

  /* 观测点：压成次级，前面一道细线把它和日月分开 */
  .info .ft{
    display:flex;align-items:baseline;gap:3px;
    margin-top:8px;padding-top:7px;
    border-top:1px solid rgba(255,255,255,.07);
  }
  .info .ft .kk{margin-right:6px;}
  .info .ft .lb{font-size:9.5px;letter-spacing:.2px;color:rgba(255,255,255,.34);}
  .info .ft b{font-size:11px;font-weight:500;color:rgba(255,255,255,.82);}
  .info .src{margin-left:auto;font-size:9.5px;color:rgba(255,255,255,.3);}
  .info .src.warn{color:rgba(240,161,58,.75);}

  /* 控件条：常驻，不再淡出。看板要的是"随时能点",不是"先晃鼠标" */
  .ui{
    position:absolute;left:0;right:0;bottom:0;
    height:96px;
    transition:transform .26s ease;
    padding:9px 26px 11px;
    background:#05070d;
    border-top:1px solid rgba(255,255,255,.06);
    font-size:15px;
  }
  .ui .bar{margin:0;}
  .ui .bar .btn{height:36px;padding:0 16px;font-size:14px;border-radius:9px;}
  .ui .bar .scrub{height:5px;}
  .ui .spd{margin:0 0 0 20px;font-size:13px;gap:8px;}
  .ui .spd-b{height:28px;padding:0 11px;font-size:12.5px;border-radius:7px;}
  /* 钉住是一个状态开关，配色沿用"选中"那一套（和倍速按钮一致） */
  .ui .bar .btn.pin{padding:0 11px;font-size:13px;color:rgba(255,255,255,.55);}
  .ui .bar .btn.pin.on{border-color:rgba(255,215,0,.5);color:#FFD700;background:rgba(255,215,0,.09);}
  /* 没钉住时控件条滑下去，画布同时铺满整屏 —— 底下不会留一条黑边 */
  body.bar-hidden .ui{transform:translateY(100%);}
  .ui .obs{margin:9px 0 0;font-size:12.5px;gap:14px;}
  .ui .obs input{width:96px;height:28px;font-size:13px;border-radius:7px;}
  .ui .obs-k{font-size:10px;letter-spacing:2.4px;color:rgba(255,255,255,.3);margin-right:4px;}
</style>
</head>
<body>
<div class="app">

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <canvas id="mk"></canvas>

    <!-- 读数卡：一行一类信息，主体名对齐成一列，状态词在卡头 -->
    <div class="info">
      <div class="hd"><span class="kk">此刻</span><b id="word">—</b><span class="t" id="clock">—</span></div>

      <div class="row th2"><span></span><span></span><span class="thk">高度</span><span class="thk r">直射</span></div>

      <div class="row">
        <span class="who"><span class="dot d-sun"></span>太阳</span>
        <span class="st" id="sunState">—</span>
        <span class="stat" id="sunH"></span>
        <span class="stat sm" id="sunL"></span>
      </div>
      <div class="ev"><span id="sunA"></span><span id="sunB"></span></div>

      <div class="row">
        <span class="who"><span class="dot d-moon"></span>月亮</span>
        <span class="st" id="moonState">—</span>
        <span class="stat" id="moonH"></span>
        <span class="stat sm" id="moonL"></span>
      </div>
      <div class="ev"><span id="moonA"></span><span id="moonB"></span></div>

      <div class="ft">
        <span class="kk">观测点</span>
        <span id="obsTxt"></span>
        <span class="src" id="obsSrc">—</span>
      </div>
    </div>
  </div>

  <!-- 控件：常驻，不淡出 -->
  <div class="ui" id="ui">
    <div class="bar">
      <button class="btn primary" id="play">▶ 播放</button>
      <button class="btn" id="now">现在</button>
      <button class="btn pin" id="pin" title="钉住控件条；关掉后鼠标停手 2.5 秒控件条自动滑下去">钉住</button>
      <input class="scrub" id="scrub" type="range" min="0" max="1" step="60">
      <span class="spd" id="spd">
        <span>1 秒 =</span>
        <button class="spd-b" data-s="2400" title="1 秒走 40 分钟">40 分</button>
        <button class="spd-b" data-s="1800" title="1 秒走 30 分钟">30 分</button>
        <button class="spd-b" data-s="1200" title="1 秒走 20 分钟">20 分</button>
        <button class="spd-b" data-s="900" title="1 秒走 15 分钟">15 分</button>
        <button class="spd-b" data-s="600" title="1 秒走 10 分钟">10 分</button>
        <button class="spd-b" data-s="300" title="1 秒走 5 分钟">5 分</button>
      </span>
    </div>

    <div class="obs">
      <span class="obs-k">观测点</span>
      <label>经度 <input id="inpLon" type="text" inputmode="decimal" spellcheck="false" autocomplete="off"></label>
      <label>纬度 <input id="inpLat" type="text" inputmode="decimal" spellcheck="false" autocomplete="off"></label>
    </div>
  </div>

</div>

<script>
/* 本页不读事件文件：位置全靠星历算 */

/* ============================================================
   几何常量
   SkinWidth 420 / SkinHeight 300 / IconSize 21 / Length 360
   高度从 256 加到 300，纯粹是纵轴量程的需要：
     赤道 + 春分那天太阳从 +90°（天顶）走到 −90°（天底），整整 180°；
     1° = 1.2px 就是 216px，再加两边各 10px 的圆点半径 → 至少 236px 的画布高。
     地平线放正中（上下同比例），取到 247 是为了两头各还剩 5~6px 余量。
   ============================================================ */
const W = 420, H = 300;
const IconSize = 21, Length = 360;
const LABEL_H = 14;                            // 底部留给轴标签（359° / 0°）的高度
const TITLE_H = 39;                            // 顶部留给标题的高度
const ContainerH = H - LABEL_H - TITLE_H;      // 247：画布区，真正画图的地方
const ContainerW = W - 20;                     // 400
const ContainerX = (W / 2 - ContainerW / 2) - 1; // 9
const ContainerY = H - LABEL_H - ContainerH;   // 39：顶部留给标题，不随 H 变化

/* 这一版是给 1280×800 全屏当面板用的：顶部那条标题带整块不要。
   做法不是改几何，而是从 TITLE_H 这一刀切下去、把剩下的 420×261 当画面，
   再等比铺到屏幕上——坐标、倍率、算法一个字都没动。 */
const CROP   = TITLE_H;                        // 39：从顶边切掉这么多
const VIEW_H = H - CROP;                       // 261：切完之后的画面高度
const HorizonY = (ContainerH - 1) / 2;         // 123：地平线在正中
const XAxisStart = ContainerW / 2 - Length / 2; // 20
const edgePad = (IconSize - 1) / 2;            // 10：地平线两头各多画一点，和标记的宽对齐

/* 观感单位：1 CSS 像素 = 多少皮肤单位。
   画面是 420×300 被放大约 3 倍铺满 1280×800，若线宽、字号、圆点半径都照皮肤值画，
   它们会跟着放大 3 倍——1px 地平线变 3px 粗、8px 注脚变 24px 标题、日月圆点直径 60px。
   所以凡是"看起来多大"的量都乘 U，几何位置仍用皮肤坐标。sizeCanvas 里更新。 */
let U = 1;

/* ============================================================
   观测点：三档来源，优先级 手填 > 自动 > 默认
   这里只存一份真值，下面的 elevation / 升落全部读它
   ============================================================ */
const DEFAULT_LAT = 39.90, DEFAULT_LON = 116.40;
const OBSERVER = { lat: DEFAULT_LAT, lon: DEFAULT_LON, src: '默认' };
let observerManual = false;   // 手填过就一直用手填的，自动定位不再顶掉它

/* 地平线取 0° 几何地平：不扣折射、不扣视半径、月亮不扣地平视差。
   升落就是"真实高度穿过 H0"那一刻，与 index 里 alt > 0 即白天同一口径。
   ⚠ 改这个数要同步改两处说明（搜「同一口径」）：一处是本段，一处是底栏"升落"那段；
     否则代码和注释会打架，下一个读的人会以为 H0 该改回 0。 */
const H0 = 0;

/* ============================================================
   工具函数
   ============================================================ */
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
// 注意：clamp 把 NaN 原样穿过去（两个比较都是 false）。这是故意的——
//   把 NaN 换成 lo 会让"算错了"变成"看起来正常但位置是错的"，那种更难查。
//   所以 NaN 必须在上游挡掉：经纬度走 Number.isFinite 判，高度角走 asinSafe 夹。

// asin 的入参夹到 [−1, 1]。
//   理论上 sin h 的表达式恒在范围内，但天顶/天底那一刻 sin²φ+cos²φ 在浮点里
//   可能算成 1±1e-16，而 Math.asin(1+ε) 直接返回 NaN —— 那会让圆点凭空消失、
//   面板全变成 NaN，而且一句错都不报。夹一下就没有这条路。
//   注：asin 的输出天生锁在 [−90°, +90°]，所以"极昼极夜会不会超过 ±90"在数学上不可能；
//   极昼只是把最低高度抬到 0 以上，极夜只是把最高高度压到 0 以下，两端互相靠拢，不会越界。
function asinSafe(v){
  if (!Number.isFinite(v)) return NaN;
  return Math.asin(v < -1 ? -1 : (v > 1 ? 1 : v));
}

// 两位数补零：日期格式化的三处共用，别各写一份
function pad2(n){ return n < 10 ? "0" + n : "" + n; }

/* ============================================================
   直射经度由星历直接算：λ = 天体赤经 − 格林尼治恒星时
   （太阳、月亮同一套，升落时刻不参与）
   X 轴：左 359° → 右 0°，1px = 1°
   ============================================================ */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const EPS = 23.4392911 * D2R;          // 黄赤交角

function mod360(v){ return ((v % 360) + 360) % 360; }
function jdOf(sec){ return sec / 86400 + 2440587.5; }        // Unix 秒 → 儒略日
function centuryOf(jd){ return (jd - 2451545.0) / 36525; }
function gmstDeg(jd){ return mod360(280.46061837 + 360.98564736629 * (jd - 2451545.0)); }

/* 黄道 → 赤道。必须带黄纬 β：月亮 β 能到 ±5.3°，漏掉这一项赤经会错到 1.6°，
   月出月落跟着差近十分钟；太阳 β ≈ 0，传 0 就是原来的样子 */
function eclToRa(lamDeg, betDeg){
  const l = lamDeg * D2R, b = (betDeg || 0) * D2R;
  return mod360(Math.atan2(
    Math.sin(l) * Math.cos(EPS) - Math.tan(b) * Math.sin(EPS),
    Math.cos(l)) * R2D);
}

function sunLam(jd){
  const T = centuryOf(jd);
  const L0 = 280.46646 + 36000.76983 * T;
  const M  = (357.52911 + 35999.05029 * T) * D2R;
  const C  = (1.914602 - 0.004817 * T) * Math.sin(M)
           + 0.019993 * Math.sin(2 * M)
           + 0.000289 * Math.sin(3 * M);
  return L0 + C;
}
function sunRa(jd){ return eclToRa(sunLam(jd), 0); }

function moonEcl(jd){
  const T  = centuryOf(jd);
  const Lp = 218.3164477 + 481267.88123421 * T;
  const D  = (297.8501921 + 445267.1114034 * T) * D2R;
  const M  = (357.5291092 + 35999.0502909 * T) * D2R;
  const Mp = (134.9633964 + 477198.8675055 * T) * D2R;
  const F  = (93.2720950 + 483202.0175233 * T) * D2R;
  const lam = Lp
            + 6.289 * Math.sin(Mp)
            + 1.274 * Math.sin(2 * D - Mp)
            + 0.658 * Math.sin(2 * D)
            + 0.214 * Math.sin(2 * Mp)
            - 0.186 * Math.sin(M)
            - 0.114 * Math.sin(2 * F);
  // 黄纬：四项主项。第 4 项是 +0.173·sin(2D−F)（原来写成减号了），
  //   第 5 项 2D−M′+F 一并补上，凑够 0.2° 以内的量级
  const bet = 5.128 * Math.sin(F)
            + 0.281 * Math.sin(Mp + F)
            + 0.278 * Math.sin(Mp - F)
            + 0.173 * Math.sin(2 * D - F)
            + 0.055 * Math.sin(2 * D - Mp + F);
  return { lam: lam, bet: bet };
}
// 赤经、赤纬必须用同一份 β，否则赤经赤纬就不是同一个点了
function moonRa(jd){ const e = moonEcl(jd); return eclToRa(e.lam, e.bet); }

// 月相：日月黄经差决定亮面比例。0 = 朔，0.5 = 弦，1 = 望
function moonPhase(t){
  const jd = jdOf(t);
  const elong = mod360(moonEcl(jd).lam - sunLam(jd));
  return { elong: elong, k: (1 - Math.cos(elong * D2R)) / 2 };
}

// 直射经度：赤经减格林尼治恒星时，就是它当头的那条经线
function bodyLon(t, isSun){
  const jd = jdOf(t);
  return mod360((isSun ? sunRa(jd) : moonRa(jd)) - gmstDeg(jd));
}

// 左 359° → 右 0°
function lonPx(lon){ return mod360(359 - lon); }

/* ============================================================
   观测点：X 不含纬度，Y 必须含——没有观测点就没有高度角
   经纬度取自 OBSERVER，改位置不用重启，重画一帧即可
   ============================================================ */
const PX_PER_DEG = 1.2;        // 1° 高度 = 1.2px，地平线上下同比例

function decOf(jd, isSun){
  if (isSun) return asinSafe(Math.sin(EPS) * Math.sin(sunLam(jd) * D2R)) * R2D;
  const e = moonEcl(jd);
  const lam = e.lam * D2R, bet = e.bet * D2R;
  return asinSafe(Math.sin(bet) * Math.cos(EPS)
                + Math.cos(bet) * Math.sin(EPS) * Math.sin(lam)) * R2D;
}

// 高度角：sin h = sinφ·sinδ + cosφ·cosδ·cosH，H 是本地时角
function altitude(t, isSun){
  const jd = jdOf(t);
  const dec = decOf(jd, isSun) * D2R;
  const H = (gmstDeg(jd) + OBSERVER.lon - (isSun ? sunRa(jd) : moonRa(jd))) * D2R;
  const phi = OBSERVER.lat * D2R;
  return asinSafe(Math.sin(phi) * Math.sin(dec)
                + Math.cos(phi) * Math.cos(dec) * Math.cos(H)) * R2D;
}

// 高度角 → 画布区内的 y。虽然是像素映射，但它是 solveBody 直接产出的一步（out.y），
//   和 altitude 一起构成"高度角 → 位置"这条链，所以留在这里而不是挪去画布段。
function yOfAltitude(h){
  return clamp(HorizonY - h * PX_PER_DEG, 6, ContainerH - 8);
}

/* ============================================================
   状态词：把"太阳此刻有多高"翻成一个词（深夜 → 凌晨 → 早晨 → 上午 → 正午
   → 下午 → 傍晚 → 入夜 → 半夜 → 又回深夜）
   台阶表原样取自 Globe 分支的 STATE_RULES，不改一个 k——两个页面说的是同一件事，
   口径必须一致，否则同一个时刻两页会给出不同的词。

   分界为什么不写死度数：太阳的高低跨度随纬度和季节伸缩。写死度数，高纬的冬天整天
   只升到 6°，"上午"会被压成一条缝；白夜里太阳又不沉下去，"入夜"永不出现。
   按比例切，分界就跟着跨度一起伸缩。

   每行四个字段：
     word   越过这条分界之后叫的词
     frac   这条分界按哪个尺度切：'hMax' = 当天最高高度（切白天）
                                  'depth' = 今晚最深的深度（切夜里）
     k      占那个尺度的多少，0.2 就是 20%
     closeUp 正好压在线上时算哪边：true 算上面那个词（≥），false 算下面（>）
   ============================================================ */

const STATE_RULES = {
  polarTolerance: 0.5,       // 太阳最高只到地平线上这么多度以内记极夜；最低只沉这么多度以内记极昼

  // 东侧：还没到中天，一天的上半天，从低到高
  east: {
    floorWord: '深夜',
    steps: [
      { word: '凌晨', frac: 'depth', k: 0.750, closeUp: false },
      { word: '早晨', frac: 'depth', k: 0.080, closeUp: true  },
      { word: '上午', frac: 'hMax',  k: 0.220, closeUp: true  },
      { word: '正午', frac: 'hMax',  k: 0.990, closeUp: true  }
    ]
  },

  // 西侧：已经过了中天，一天的下半天，从低到高
  west: {
    floorWord: '深夜',
    steps: [
      { word: '半夜', frac: 'depth', k: 0.910, closeUp: false },
      { word: '入夜', frac: 'depth', k: 0.560, closeUp: true  },
      { word: '傍晚', frac: 'depth', k: 0.095, closeUp: false },
      { word: '下午', frac: 'hMax',  k: 0.130, closeUp: true  },
      { word: '正午', frac: 'hMax',  k: 0.970, closeUp: true  }
    ]
  }
};

// 时刻状态词：先算两个尺度，再把高度角从最深那道分界往上过一遍，越过几级就落到第几个词
// obsLat 观测点纬度  sunLat 直射纬度  h 太阳高度角  dLon 经度差（观测点减直射点）
function calcHourState(obsLat, sunLat, h, dLon){
  const hMax  = 90 - Math.abs(obsLat - sunLat);        // 今天太阳最高能到多少
  const hMin  = Math.abs(obsLat + sunLat) - 90;        // 今晚太阳最低会沉到多少（通常为负）
  const depth = Math.abs(hMin);                        // 夜里的尺度

  if (hMax <= STATE_RULES.polarTolerance) return '极夜';   // 整日不出、整日不下，其余全让位
  if (hMin >= -STATE_RULES.polarTolerance) return '极昼';

  const side = dLon < 0 ? STATE_RULES.east : STATE_RULES.west;   // 东侧还没过中天，西侧已经过
  let word = side.floorWord;
  for (const step of side.steps){
    const v = step.frac === 'hMax' ? step.k * hMax : -step.k * depth;
    const passed = step.closeUp ? h >= v : h > v;
    if (!passed) break;
    word = step.word;
  }
  return word;
}

// 经度差折到 (-180, 180]：不折的话 359° 与 0° 会差出整整一圈，东西侧会判反
function wrap180(v){ return ((v + 180) % 360 + 360) % 360 - 180; }

// 当前这一刻的状态词：星历只问三件事——直射纬度、高度角、直射经度
function hourState(t){
  const jd = jdOf(t);
  return calcHourState(OBSERVER.lat, decOf(jd, true), altitude(t, true),
                       wrap180(OBSERVER.lon - bodyLon(t, true)));
}


// 解 h(t) = 地平线：从 from 按 dir 扫，命中想要的升高/降低方向后二分收敛。
//   limit 是本轮的终点（下一道接缝）：越过它才算的升落不属于这一轮，返回 null。
//   没有这个约束时，高纬度"今天不落、明天才落"的情形会把明天那次画到这一轮的轴上。
function findCross(isSun, from, dir, wantRising, limit){
  let t = from, s = altitude(t, isSun) - H0;
  for (let i = 0; i < 200; i++){
    let t2 = t + 600 * dir, atEnd = false;

    /* 顺序是先截断、再判穿越，不能反过来。
       终点几乎总落在某个 10 分钟步长的中间：比如终点 09:11:14、这一步 09:05:02 → 09:15:02，
       落点 09:09:36 明明在这一轮里。若先问"整步越过终点没有"，就会把整段作废、落到 —
       正确做法是把右端截到 09:11:14，拿 09:05:02 → 09:11:14 这一段去比高度。 */
    if (limit != null && dir > 0 && t2 > limit){ t2 = limit; atEnd = true; }
    if (t2 <= t) return null;                    // 已经站到终点上，没有下一步可走
    const s2 = altitude(t2, isSun) - H0;

    if (s * s2 <= 0){
      let a = t, b = t2, sa = s;
      for (let k = 0; k < 18; k++){
        const m = (a + b) / 2, sm = altitude(m, isSun) - H0;
        if (sa * sm <= 0) b = m; else { a = m; sa = sm; }
      }
      // 扫描方向决定判据：向前扫时 s2 更晚，向后扫时 s2 更早
      const goingUp = (dir > 0) ? (s2 > s) : (s2 < s);
      if (goingUp === wantRising) return (a + b) / 2;
      t = t2; s = s2;
      if (atEnd) return null;                    // 走到终点仍不是想要的方向，本轮没有
      continue;
    }
    if (atEnd) return null;                      // 到终点都没有穿越
    t = t2; s = s2;
  }
  return null;
}

// 本轮的起点：λ 从 0 附近跳回 360 的瞬间 —— 也就是圆点从右端滑出、左端滑入那一刻。
//   一轮的升落就按这个起点算，于是读数只在"越过终点"这一下变化；
//   不再在"日落月落"和"过零点"两个跟画面无关的地方各变一次。
//   做法：往回找 λ 那一跳（往回走 λ 本该增大，猛地掉下来就是跨过了接缝），再二分收敛
function seamBefore(t, isSun){
  let a = t, lamA = bodyLon(a, isSun);
  for (let i = 0; i < 200; i++){
    const b = a - 1800, lamB = bodyLon(b, isSun);
    if (lamB < lamA - 180){          // 往回跨过了接缝
      let lo = b, hi = a;            // lo 在接缝之前（λ≈0+），hi 在之后（λ≈360−）
      for (let k = 0; k < 26; k++){
        const m = (lo + hi) / 2;
        if (bodyLon(m, isSun) < 180) lo = m; else hi = m;
      }
      // 取整到秒：二分残差在亚毫秒级，不取整的话"同一轮"里重算会差出几毫秒，
      //   读数虽然看不出，但缓存键和逐帧比较会跟着抖
      return Math.round((lo + hi) / 2);
    }
    a = b; lamA = lamB;
  }
  return null;
}

// 升落是解出来的，不是查出来的，按"这一轮"算：从圆点越过终点（接缝）那一刻起，
//   一轮之内必有一次升起、一次落下，取各自的第一次。
//   注意不要预设"日出在前"：观测点经度接近 0° 时接缝正好落在中天，
//   那一刻的一轮是从正午到正午，于是日落在前、次日日出在后。谁在前由 X 轴决定，见 solveBody。
//   缓存键取"接缝落在哪个小时"：它只在新一轮开始那一刻变，不会把跃变推到整点上跟画面错开
const riseSetCache = { sun: null, moon: null };
function riseSet(isSun, now){
  const seam = seamBefore(now, isSun);
  const key = Math.floor((seam == null ? now : seam) / 3600)
            + '|' + OBSERVER.lat + '|' + OBSERVER.lon + '|' + (isSun ? 's' : 'm');
  const c = isSun ? riseSetCache.sun : riseSetCache.moon;
  if (c && c.key === key) return c;

  let rise = null, set = null;
  if (seam != null){
    // 本轮到哪结束：再往前一道接缝。往后探 110000 秒（约 30.5 小时）足够跨过一轮，
    //   月亮的周期比太阳短，实测约 25 小时，留足余量。
    //   万一回扫异常（end 没能在本轮之后），就不加约束，退回旧行为，别把事件全判没了。
    const end = seamBefore(seam + 110000, isSun);
    const limit = (end != null && end > seam + 3600) ? end : null;
    rise = findCross(isSun, seam, 1, true,  limit);
    set  = findCross(isSun, seam, 1, false, limit);
  }
  const out = { key: key, rise: rise, set: set, seam: seam };
  if (isSun) riseSetCache.sun = out; else riseSetCache.moon = out;
  return out;
}

// 单个天体的完整解算：X = 直射经度，Y = 真高度角，升落由 h = 0 解出
function solveBody(now, isSun){
  const lon = bodyLon(now, isSun);
  const alt = altitude(now, isSun);
  const rs  = riseSet(isSun, now);

  const out = {
    lon: lon,
    x: XAxisStart + lonPx(lon),
    y: yOfAltitude(alt),
    alt: alt,
    state: alt > altitude(now - 120, isSun) ? "上升" : "下降",
    rise: rs.rise,
    set: rs.set,
    riseX: null,
    setX: null,
    riseFirst: true,
    isSun: isSun              // 极昼极夜要用它选措辞（太阳才叫极昼/极夜）
  };

  if (out.rise != null) out.riseX = XAxisStart + lonPx(bodyLon(out.rise, isSun));
  if (out.set  != null) out.setX  = XAxisStart + lonPx(bodyLon(out.set,  isSun));

  // 读数按 X 轴的先后输出：本轮之内 x 随时间单调增，所以"谁靠左"就等于"谁先到"。
  //   日落在前也行、日出在前也行，不预设哪个是第一个。
  out.riseFirst = (out.rise == null) ? false
                : (out.set  == null) ? true
                : out.rise < out.set;
  return out;
}

/* ============================================================
   画布
   ============================================================ */
const stage = document.getElementById("stage");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const mk  = document.getElementById("mk");     // 标记层：只画日月圆点和升落小点
const mctx = mk.getContext("2d");
/* 位图密度跟着屏幕走。
   这一版占满整个浏览器窗口（全屏就是 1280×800），绘制坐标仍是 420×300 皮肤坐标，
   由 setTransform 一次性放大到实际尺寸；绘制函数一行都不用改。
   注意三点（都踩过）：
     1. dpr 必须在函数内每次重读——窗口拖到另一块不同缩放的屏上会变；
     2. 用 setTransform 而不是 scale——改 cv.width 会重置整个上下文状态；
     3. 这里不含 paint()。启动那次由 init() 统一画一帧，否则同一帧会算两遍 solveBody。 */
const view = { s: 1, ox: 0, oy: 0 };          // 本次的倍率与黑边偏移

function sizeCanvas(){
  const dpr  = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = stage.clientWidth  || window.innerWidth  || W;
  const cssH = stage.clientHeight || window.innerHeight || VIEW_H;

  // 图只占上面那一段，底部 96px 是控件条的位置。这个高度是常量，不随控件条显隐变化，
  //   所以收起/展开控件条时倍率一点不变、画面不跳；多出来的那 96px 只是多画一层天空。
  const barH = (document.querySelector(".ui") || {}).offsetHeight || 96;
  const fitH = Math.max(1, cssH - barH);
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);

  // 等比塞进去：宽、高各算一次倍率取小的，空出来的黑边左右/上下各一半。
  //   绝不能只按宽度算——1280×800 上按宽算会高出一截，圆点被顶出画面。
  const s = Math.min(cssW / W, fitH / VIEW_H);
  view.s  = s;
  view.ox = (cssW - W * s) / 2;                 // 左右黑边
  view.oy = (fitH - VIEW_H * s) / 2;            // 上下黑边（只按上面那一段算）

  // 绘制坐标仍是 420×300 的皮肤坐标，只是整体上移 CROP，让标题带跑到画面外
  ctx.setTransform(s * dpr, 0, 0, s * dpr, view.ox * dpr, (view.oy - CROP * s) * dpr);

  // 标记层跟主画布同尺寸、同变换，只是画在更上面一层
  mk.width  = cv.width;
  mk.height = cv.height;
  mctx.setTransform(s * dpr, 0, 0, s * dpr, view.ox * dpr, (view.oy - CROP * s) * dpr);

  // 观感单位：皮肤的 1 单位在这块屏上是 s 个 CSS 像素，所以 1 CSS 像素 = 1/s 皮肤单位
  U = 1 / s;
}

// 容器内坐标 -> 皮肤坐标
const px = function(x){ return ContainerX + x; };
const py = function(y){ return ContainerY + y; };

/* 天色：按太阳高度角在几张关键色之间插值。
   −18° 以下算夜，−18°~0° 是晨昏，0° 以上是白天；h = 0 那一档故意偏暖（日出日落）。
   三段色：天顶 / 地平线 / 天底。暖色只放在地平线那一圈——日出日落是地平线在烧，
   把暖色放到顶端就成了一片棕；颜色整体压暗，主角仍是那两个圆点。
   关键色在地平线附近排得很密（每 2~4 度一档）：稀疏的话，线性插值会在每一档"折一下"，
   看起来就是颜色变到一半突然换方向。 */
const SKY_KEYS = [
  { h: -90, zen: [ 3,  5, 11], hz: [ 4,  6, 12], nad: [ 2,  3,  6] },
  { h: -18, zen: [ 5,  7, 15], hz: [ 6,  8, 17], nad: [ 3,  4,  8] },
  { h: -12, zen: [ 9, 11, 26], hz: [16, 15, 30], nad: [ 4,  5, 11] },
  { h:  -8, zen: [14, 16, 38], hz: [34, 26, 42], nad: [ 5,  6, 13] },
  { h:  -4, zen: [21, 23, 52], hz: [72, 42, 44], nad: [ 6,  7, 15] },
  { h:  -1, zen: [26, 29, 62], hz: [108, 60, 45], nad: [ 7,  8, 16] },
  { h:  +1, zen: [28, 33, 70], hz: [118, 72, 52], nad: [ 8,  9, 18] },
  { h:  +4, zen: [29, 38, 78], hz: [104, 82, 66], nad: [ 8, 11, 22] },
  { h:  +8, zen: [29, 43, 88], hz: [80, 86, 100], nad: [ 9, 13, 27] },
  { h: +15, zen: [30, 50, 100], hz: [58, 82, 114], nad: [10, 16, 32] },
  { h: +40, zen: [32, 60, 112], hz: [48, 76, 118], nad: [12, 20, 38] },
  { h: +90, zen: [33, 63, 116], hz: [46, 74, 118], nad: [13, 22, 40] }
];
function skyMix(a, b, t){
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function skyCss(v){
  return "rgb(" + Math.round(v[0]) + "," + Math.round(v[1]) + "," + Math.round(v[2]) + ")";
}
function skyAt(h){
  const k = SKY_KEYS;
  if (h <= k[0].h) return { zen: k[0].zen, hz: k[0].hz, nad: k[0].nad };
  const last = k[k.length - 1];
  if (h >= last.h) return { zen: last.zen, hz: last.hz, nad: last.nad };
  let i = 0;
  while (i < k.length - 2 && h > k[i + 1].h) i++;
  const t = (h - k[i].h) / (k[i + 1].h - k[i].h);
  return {
    zen: skyMix(k[i].zen, k[i + 1].zen, t),
    hz:  skyMix(k[i].hz,  k[i + 1].hz,  t),
    nad: skyMix(k[i].nad, k[i + 1].nad, t)
  };
}

/* 星空：纯装饰。位置用固定种子生成一次，之后永不变——否则每次重绘星星都在跳。
   x/y 都是 0..1 的归一化坐标，映射到"轴宽 × 地平线以上那一段"。
   r 是观感半径（CSS 像素），a 是基准亮度，w 决定偏冷还是偏暖。 */
const STARS = (function(){
  let seed = 20261126;
  const rnd = function(){                       // xorshift32：可复现，不依赖 Math.random
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return ((seed >>> 0) % 100000) / 100000;
  };
  const out = [];
  for (let i = 0; i < 150; i++){
    out.push({
      x: rnd(), y: rnd(),
      r: 0.55 + rnd() * 0.85,
      a: 0.20 + rnd() * 0.75,
      w: rnd()                                  // > .62 偏暖，其余偏冷
    });
  }
  return out;
})();

// 月亮这一帧怎么画：亮面比例、黄经差、整体透明度。drawMoonAt 读它
const MOON_DRAW = { k: 1, elong: 180, alpha: 1 };

// 三个绘制原语都按「画布坐标」收参：外层要能把同一个点平移到 ±360px 的副本位置上
function drawSunAt(g, X, Y){
  const spikes = 8;
  const core = 12 * U, tip = 20 * U;     // 观感半径（CSS 像素）：核心 12、尖角 20
  g.save();
  g.translate(X, Y);
  g.fillStyle = "rgba(255,215,0,.95)";
  g.beginPath();
  for (let i = 0; i < spikes * 2; i++){
    const ang = (Math.PI / spikes) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? tip : core;
    const cx = Math.cos(ang) * rad, cy = Math.sin(ang) * rad;
    if (i === 0) g.moveTo(cx, cy); else g.lineTo(cx, cy);
  }
  g.closePath();
  g.fill();
  g.beginPath();
  g.arc(0, 0, core, 0, Math.PI * 2);
  g.fillStyle = "#FFE558";
  g.fill();
  g.restore();
}

/* 月牙：按真实月相画。
   k = 亮面比例（0 朔 / 0.5 弦 / 1 望）。明暗界线是一条半椭圆，横向半轴 = R·|2k−1|：
   k = 0.5 时它退化成一条直线（正好半月），k = 1 时与左半边缘重合（满月），k = 0 时与右半重合（新月）。
   亮面朝左还是朝右，由"盈亏 + 观测者半球"决定：北半球上弦亮面朝右，南半球看到的左右相反。 */
function drawMoonAt(g, X, Y){
  const R = 14 * U;
  const k = Math.min(1, Math.max(0.10, MOON_DRAW.k));   // 形状留 10% 底线：朔日也留一道细边，别让人找不到点
  const a = Math.abs(2 * k - 1) * R;                    // 终止线横向半轴
  const litRight = (MOON_DRAW.elong < 180) === (OBSERVER.lat >= 0);
  g.save();
  g.translate(X, Y);
  if (!litRight) g.scale(-1, 1);                        // 一律按"亮面朝右"画，需要时整体镜像
  g.beginPath();
  g.arc(0, 0, R, -Math.PI / 2, Math.PI / 2, false);     // 右半：月球边缘
  g.ellipse(0, 0, a, R, 0, Math.PI / 2, -Math.PI / 2, k < 0.5);  // 左半：明暗界线
  g.closePath();
  g.fillStyle = "rgba(30,144,255," + MOON_DRAW.alpha.toFixed(3) + ")";
  g.fill();
  g.restore();
}

/* 环形横轴的跨界画法。
   359° 与 0° 在几何上是邻居，可画面上隔着 360px。所以把圆点按一个周期画三份
   （左副本 / 本体 / 右副本），并裁在轴的两端之内：
     跨接缝那一刻，右端露出左半边、左端露出右半边，两块拼起来正好是整个圆点；
     再走一步，比例就从 1/2+1/2 变成 3/4+1/4 —— 是"滑过去"，不是"跳过去"。
   注意裁剪线取在轴的两端（XAxisStart 与 XAxisStart+Length），不是整块画板，
   这样两端的半个点才拼得严丝合缝，也不会和地平线两头的延长段打架。 */
function drawWrapped(g, xLocal, yLocal, drawAt){
  const X = px(xLocal), Y = py(yLocal);
  g.save();
  g.beginPath();
  g.rect(px(XAxisStart), 0, Length, H);   // 注意走 px()：XAxisStart 是局部坐标
  g.clip();
  for (let k = -1; k <= 1; k++) drawAt(g, X + k * Length, Y);
  g.restore();
}

// 升落标记：1 皮肤像素的小圆点（屏幕上约 3px），不裁剪。它不是第二个主角，只是"这里升/这里落"的记号
function drawMark(g, x, color){
  g.save();
  g.fillStyle = color;
  g.beginPath();
  g.arc(px(x), py(HorizonY), 2.6 * U, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function render(now){
  // 清屏要在"设备像素"里清整张位图：走变换后清 420×300 只能盖住中间一块，
  //   黑边那块会留下上一帧的残影
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();

  // 顶部那条标题带整块不要了（CROP 已经把它切在画面外），所以这里不再画 "SUN MOON TRACKER"

  const sun  = solveBody(now, true);
  const moon = solveBody(now, false);

  /* 月相与亮度。亮面比例本来就有（日月黄经差），不用另算；
     亮度取 k^1.4 而不是 k 本身——满月有冲日效应，弦月不该按线性发亮。
     再乘一个高度消光：贴近地平线时变暗，但限幅在 0.62，照实数算月亮就没了。 */
  const ph = moonPhase(now);
  MOON_DRAW.k = ph.k;
  MOON_DRAW.elong = ph.elong;
  MOON_DRAW.alpha = (0.42 + 0.58 * Math.pow(ph.k, 1.4))
                  * (0.62 + 0.38 * Math.min(1, Math.max(0, moon.alt) / 25));

  /* 天色 = 太阳高度角决定的基色 + 月色把夜空抬一档。
     月色只在夜里起作用，三个因子相乘：
       · 亮面比例 k^1.5 —— 和月亮图标用同一个口径，两处不会各说各话
       · 月亮在地平线以上的高度 —— 落下去就不照亮了；高过 45° 算满额
       · 太阳落得多深（−12° 以下算全黑）—— 白天月光可以忽略
     这三个因子是自洽的：满月整夜挂在天上，新月夜里根本不在，所以"月相"和"在不在"
     本来就是同一件事的两面。 */
  const sc = skyAt(sun.alt);
  const moonUp  = moon.alt <= 0 ? 0 : Math.min(1, moon.alt / 45);
  const nightD  = Math.min(1, Math.max(0, -sun.alt / 12));
  const moonlit = Math.pow(ph.k, 1.5) * moonUp * nightD;

  const zenC = skyMix(sc.zen, [40, 54, 92],  0.58 * moonlit);
  const hzC  = skyMix(sc.hz,  [56, 72, 112], 0.58 * moonlit);
  const nadC = skyMix(sc.nad, [18, 24, 42],  0.58 * moonlit);

  // 涂抹范围比画面宽一圈，两边的黑边也跟着变色，不会在画框边上留下一条硬缝
  const gyTop = py(0), gyBot = H;
  const sky = ctx.createLinearGradient(0, gyTop, 0, gyBot);
  // 暖色收紧成一条带：地平线正中最暖，往下一小段就迅速压暗，
  //   不这么做的话橙色会铺满半个画面，太阳反而被淹掉
  const hzT = (py(HorizonY) - gyTop) / (gyBot - gyTop);
  sky.addColorStop(0, skyCss(zenC));
  sky.addColorStop(Math.max(0, hzT - 0.18), skyCss(skyMix(zenC, hzC, 0.5)));
  sky.addColorStop(hzT, skyCss(hzC));
  sky.addColorStop(Math.min(1, hzT + 0.16), skyCss(skyMix(hzC, nadC, 0.62)));
  sky.addColorStop(1, skyCss(nadC));
  ctx.fillStyle = sky;
  ctx.fillRect(-90, gyTop - 90, W + 180, (gyBot - gyTop) + 180);

  /* 星空：只画在地平线以上那一段（下半屏是"地平线下"，那里不该有星）。
     亮度两个因子：天黑了才看得见；月光越亮把星星冲得越淡——真实夜空就是这样。 */
  const starA = Math.min(1, Math.max(0, -sun.alt / 9)) * (1 - 0.55 * moonlit);
  if (starA > 0.02){
    const sx0 = px(XAxisStart), sx1 = px(XAxisStart + Length);
    const sy0 = py(0),         sy1 = py(HorizonY);
    for (let i = 0; i < STARS.length; i++){
      const st = STARS[i];
      const bright = st.a * starA * (1 - st.y * 0.45);   // 贴近地平线的暗一些
      if (bright < 0.02) continue;
      ctx.beginPath();
      ctx.arc(sx0 + st.x * (sx1 - sx0), sy0 + st.y * (sy1 - sy0), st.r * U, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + (st.w > 0.62 ? "255,236,208" : "220,234,255") + "," + bright.toFixed(2) + ")";
      ctx.fill();
    }
  }

  // 高度参考线：±30°、±60°，极淡；右端各挂一个刻度，纵轴才有刻度可读
  ctx.lineWidth = U;
  ctx.font = (10 * U) + 'px "Trebuchet MS","Microsoft YaHei",sans-serif';
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const a of [-60, -30, 30, 60]){
    const gy = py(yOfAltitude(a));
    ctx.strokeStyle = "rgba(150,175,210,.085)";
    ctx.beginPath();
    ctx.moveTo(px(XAxisStart), gy);
    ctx.lineTo(px(XAxisStart + Length), gy);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.20)";
    ctx.fillText((a > 0 ? "+" : "−") + Math.abs(a) + "°", px(XAxisStart + Length + edgePad + 8), gy);
  }

  // 轴的两端：两道竖向细线。有了这两条边，接缝处被裁掉的半个圆点才读得成"滑出画框"，
  //   而不是"画坏了"（1280 宽下两口相距一千多像素，没有边界就全靠猜）
  ctx.strokeStyle = "rgba(255,255,255,.055)";
  ctx.beginPath();
  for (const ex of [px(XAxisStart), px(XAxisStart + Length)]){
    ctx.moveTo(ex, py(0));
    ctx.lineTo(ex, H);
  }
  ctx.stroke();


  // 地平线：1 CSS 像素，颜色压到刚好能看见
  ctx.strokeStyle = "rgba(150,175,210,.30)";
  ctx.lineWidth = U;
  ctx.beginPath();
  ctx.moveTo(px(XAxisStart - edgePad), py(HorizonY));
  ctx.lineTo(px(XAxisStart + Length + edgePad), py(HorizonY));
  ctx.stroke();

  // 标记层：清掉上一帧，再把升落小点和日月圆点画上去（这一层在读数卡之上）
  mctx.save();
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mk.width, mk.height);
  mctx.restore();

  // 升落标记：两端的 null 各判各的。
  //   原来只判了 riseX，setX 为 null 时 px(null) 会算出 9，在左边缘冒出个假菱形
  if (sun.riseX != null) drawMark(mctx, sun.riseX, "rgba(255,215,0,.71)");
  if (sun.setX  != null) drawMark(mctx, sun.setX,  "rgba(255,215,0,.59)");
  if (moon.riseX != null) drawMark(mctx, moon.riseX, "rgba(30,144,255,.71)");
  if (moon.setX  != null) drawMark(mctx, moon.setX,  "rgba(30,144,255,.59)");

  drawWrapped(mctx, sun.x, sun.y, drawSunAt);
  drawWrapped(mctx, moon.x, moon.y, drawMoonAt);

  // 轴的两头：不在轴上挂刻度了
  //   贴在地平线两端的字，加上左右两侧留白里本来就站着"接缝副本"的日月，
  //   两样东西一叠，比刻度本身更碍眼。改成一注：右上角一行小字说清这条轴的方向。
  ctx.save();
  ctx.font = 'bold ' + (12 * U) + 'px "Trebuchet MS","Microsoft YaHei",sans-serif';
  ctx.fillStyle = "rgba(255,255,255,.26)";
  ctx.textAlign = "center";     // 居中挂在轴上：任何窗口宽度都不会和两端的竖线打架
  ctx.textBaseline = "middle";
  ctx.fillText("经度  359° → 0°", px(XAxisStart + Length / 2), py(9));
  ctx.restore();

  return { sun: sun, moon: moon };
}

/* ============================================================
   时间控制
   窗口以"此刻"为基准：往前 2 天、往后 5 天。
   星历本身没有边界，所以窗口只是拖动条的行程，不再钉死在某个月份。
   实时模式下每 30 秒把这扇窗跟着重算一次——不然挂满五天，画面就卡在窗口右端不动了。
   ============================================================ */
const T_OPEN = Math.floor(Date.now() / 1000);
let MIN_T = T_OPEN - 2 * 86400;
let MAX_T = T_OPEN + 5 * 86400;

// 按基准时刻重排这扇窗（只动拖动条的行程，不碰当前画面）
function updateWindow(base){
  MIN_T = Math.floor(base) - 2 * 86400;
  MAX_T = Math.floor(base) + 5 * 86400;
  el.scrub.min = MIN_T;
  el.scrub.max = MAX_T;
}

// live：跟着真实时间走；playing：按倍速播。两者互斥，拖一下拖动条就退出 live
const state = { now: 0, playing: false, speed: 1800, live: true };

function fmtClock(sec){
  const d = new Date(sec * 1000);
  return (d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
// 读数分两处变，而且两处都是"看得见的事件"：
//   ① 越过接缝（终点）—— 时刻本身换成下一天的同一次，由 riseSet 负责；
//   ② 跨过零点        —— "昨日/明日"这类前缀翻篇，由这里负责。
// 前缀只能相对"现在"算，所以它必然在午夜翻。这不是 bug，是"今天/明天"这件事本身的性质：
//   同一个 07:15，23:59 时叫"明日 07:15"，00:01 时就叫"07:15"，说的都是那一件事。
function fmtHM(sec, ref){
  if (sec == null) return "—";
  const d = new Date(sec * 1000);
  const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  if (ref == null) return hm;
  const r = new Date(ref * 1000);
  const dayOf = function(o){ return Date.UTC(o.getFullYear(), o.getMonth(), o.getDate()) / 86400000; };
  const off = dayOf(d) - dayOf(r);
  if (off === 0) return hm;
  if (off === 1) return "明日 " + hm;
  if (off === -1) return "昨日 " + hm;
  // 七天窗口内不必写月份，且"D日"比"11/28"窄，塞得进面板那个定宽的日期槽\n  return d.getDate() + "日 " + hm;
}

const el = {
  play: document.getElementById("play"),
  now: document.getElementById("now"),
  scrub: document.getElementById("scrub"),
  clock: document.getElementById("clock"),
  word: document.getElementById("word"),
  sunState: document.getElementById("sunState"),
  sunH: document.getElementById("sunH"),
  sunL: document.getElementById("sunL"),
  sunA: document.getElementById("sunA"),
  sunB: document.getElementById("sunB"),
  moonState: document.getElementById("moonState"),
  moonH: document.getElementById("moonH"),
  moonL: document.getElementById("moonL"),
  moonA: document.getElementById("moonA"),
  moonB: document.getElementById("moonB"),
  obsTxt: document.getElementById("obsTxt"),
  inpLon: document.getElementById("inpLon"),
  inpLat: document.getElementById("inpLat"),
  obsSrc: document.getElementById("obsSrc"),
  pin:    document.getElementById("pin")
};

el.scrub.min = MIN_T;
el.scrub.max = MAX_T;
el.scrub.step = 60;

// 整轮一个升落都没有（极昼极夜）：这两个事件本来就不存在，别摆两个破折号，
//   直接说清楚怎么回事，比"日出 —"有用得多。太阳才叫极昼/极夜，月亮就照实说。
//   判据用 H0 而不是 0：既然一整轮都没穿过 H0，当前高度必然恒在同一侧，所以这样判是准的；
//   而用写死的 0 会和 findCross 的阈值脱钩（H0 一旦改成 −0.833 就会自相矛盾）。
//   兜底：seam == null（回扫 100 小时都没找到接缝）时 rise/set 也会是 null，
//   会走到这里按当前高度说话——这是异常路径的降级表现，不是正常语义。
function riseSetNote(b){
  if (b.rise != null || b.set != null) return null;
  const up = b.alt > H0;
  if (b.isSun) return up ? "极昼（整天不落）" : "极夜（整天不出）";
  return up ? "整天不落" : "整天不出";
}

// fmtHM 的产物拆成"日期前缀"和"时分"两段：面板里前缀有自己的一格，
//   "明日 10:08" 再长也只在它那格里，不会挤到旁边那一对事件上去
function fmtHMSplit(sec, ref){
  const s = fmtHM(sec, ref);
  const cut = s.lastIndexOf(" ");
  return cut < 0 ? { d: "", t: s } : { d: s.slice(0, cut), t: s.slice(cut + 1) };
}

// 本轮的两个升落事件，按 X 轴先后排好：标记靠左的那个在前，标签跟着一起换位。
//   读数用时分，格式交给各自的调用方。
//   两处共用这一个函数——顺序只有一份定义，不会改了一处漏掉另一处。
function orderedEvents(b, labelRise, labelSet){
  const first  = b.riseFirst ? [labelRise, b.rise] : [labelSet, b.set];
  const second = b.riseFirst ? [labelSet, b.set]   : [labelRise, b.rise];
  return [{ label: first[0], t: first[1] }, { label: second[0], t: second[1] }];
}

function paintPair(b, elA, elB, labelRise, labelSet, ref){
  // 标签和值都写在这里：升落靠左的那个排在前面，标签跟着值一起换位置，
  //   所以标签不能写死在 HTML 里。样式沿用面板那套：灰标签 + 白数值
  const note = riseSetNote(b);
  if (note){
    elA.innerHTML = '<span class="evn">' + note + '</span>';
    elB.innerHTML = '';
    return;
  }
  const e = orderedEvents(b, labelRise, labelSet);
  // 三个槽位都定宽：标签 / 日期前缀 / 时分。前缀为空也照样占位，
  //   所以"日出 07:16"和"月出 昨日 17:20"宽度一致，整行不会忽长忽短
  const one = function(ev, x){
    return '<span class="lb">' + ev.label + '</span>'
         + '<span class="d">' + (x.d || '') + '</span>'
         + '<b>' + x.t + '</b>';
  };
  // 本轮只有一个事件时，就只写那一个：不摆一根"—"占位，也不留半个空槽。
  //   这种日子只出现在高纬度的过渡日（月亮开始整天不落、或开始整天不出的那两天）。
  const have = e.filter(function(x){ return x.t != null; });
  elA.innerHTML = one(have[0], fmtHMSplit(have[0].t, ref));
  elB.innerHTML = have.length > 1
    ? '<span class="sep">·</span>' + one(have[1], fmtHMSplit(have[1].t, ref))
    : '';
}

function paint(){
  const r = render(state.now);
  el.scrub.value = state.now;
  el.clock.textContent = fmtClock(state.now);
  el.word.textContent = hourState(state.now);   // 状态词跟画面同一时刻，不各算各的

  el.sunState.textContent = r.sun.state;
  el.moonState.textContent = r.moon.state;
  // 高度角与直射经度：原先挂在悬停提示里，现在常驻读数面板——看板上不该有"凑上去才给"的数
  // 标签统一挪到表头那一行，数值格里只剩数字——不然每个数值下面多一行小字，
  //   而左边"太阳/上升"只有一行，读起来就永远差半行
  el.sunH.innerHTML  = '<b>' + r.sun.alt.toFixed(1) + '°</b>';
  el.sunL.innerHTML  = '<b>' + Math.round(r.sun.lon) + '°</b>';
  el.moonH.innerHTML = '<b>' + r.moon.alt.toFixed(1) + '°</b>';
  el.moonL.innerHTML = '<b>' + Math.round(r.moon.lon) + '°</b>';
  paintPair(r.sun,  el.sunA,  el.sunB,  '日出', '日落', state.now);
  paintPair(r.moon, el.moonA, el.moonB, '月出', '月落', state.now);
}

/* ============================================================
   实时模式：不播放、也没被拖动条拽走的时候，每 30 秒按"此刻"重算一帧。
   对齐到 :00 / :30 —— 每帧的钟点就是那一秒的真值，不会出现"写着 12:00、
   画的其实是 12:00:20 的天"。算力可以忽略：一帧就是几百步扫描，30 秒一次，
   其余时间页面完全静止，挂着不费电。
   ============================================================ */
const LIVE_MS = 30000;
let liveTimer = 0;

function scheduleLive(){
  clearTimeout(liveTimer);
  if (!state.live || state.playing) return;
  const wait = LIVE_MS - (Date.now() % LIVE_MS);   // 下一个 30 秒整点
  liveTimer = setTimeout(liveTick, wait);
}

function liveTick(){
  if (state.live && !state.playing){
    const t = Date.now() / 1000;
    updateWindow(t);                 // 窗口跟着走，挂多久都不会顶到右端
    state.now = clamp(t, MIN_T, MAX_T);
    paint();
  }
  scheduleLive();
}

/* ============================================================
   观测点：默认 → 自动 → 手填
   三档都落在同一个 applyObserverLocation 上，谁也不会各算一遍
   ============================================================ */
function fmtCoord(v){ return String(Math.round(v * 100) / 100); }

function setObsSource(src, fallback){
  el.obsSrc.textContent = src;
  el.obsSrc.classList.toggle("warn", !!fallback);
}

// 观测点按"东经/北纬"的口径写出来——Globe 那块面板就是这么写的，
//   一眼能看出是东经还是西经，不用回头再看符号
function fmtSpot(v){
  const s = Math.abs(v).toFixed(2);
  return s.replace(/0+$/, "").replace(/\.$/, "");   // 114.5000 → 114.5，37.0620 → 37.062
}

function syncObsInputs(){
  el.inpLon.value = fmtCoord(OBSERVER.lon);
  el.inpLat.value = fmtCoord(OBSERVER.lat);
  // 观测点也照面板那套写：标签灰、数值白，别把"东经"两个字也染成白的
  el.obsTxt.innerHTML =
      '<span class="lb">' + (OBSERVER.lon >= 0 ? "东经" : "西经") + '</span> <b>' + fmtSpot(OBSERVER.lon) + '°</b>'
    + '<span class="lb"> / </span>'
    + '<span class="lb">' + (OBSERVER.lat >= 0 ? "北纬" : "南纬") + '</span> <b>' + fmtSpot(OBSERVER.lat) + '°</b>';
}

function applyObserverLocation(lat, lon, src){
  OBSERVER.lat = lat;
  OBSERVER.lon = lon;
  OBSERVER.src = src;
  syncObsInputs();
  setObsSource(src, src === '默认');
  paint();          // 经纬度一换，高度角和升落全变，立刻重画一帧
}

// 手填：回车或点别处就生效。**任一个**框不是数字就整条忽略（两个都不动）；
//   都是数字则各自夹到范围内（纬度 ±90、经度 ±180）后一起生效。
function applyManualObserver(){
  const lon = parseFloat(el.inpLon.value);
  const lat = parseFloat(el.inpLat.value);
  if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;   // 填坏了就保持原位置，不报错
  observerManual = true;
  applyObserverLocation(clamp(lat, -90, 90), clamp(lon, -180, 180), '手填');
}
el.inpLon.addEventListener("change", applyManualObserver);
el.inpLat.addEventListener("change", applyManualObserver);

// 自动定位：向公开的 IP 归属地服务问一次，3 秒问不到就换下一个、全失败就留在默认
//   离线、被浏览器拦、返回格式不对，都只是"继续用现在的位置"，不会把页面挂住
function fetchJSON(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(function(){ ctl.abort(); }, ms);
  return fetch(url, { signal: ctl.signal, cache: "no-store" })
    .then(function(r){ return r.json(); })
    .catch(function(){ return null; })
    .then(function(d){ clearTimeout(timer); return d; });
}

function locateByIP(){
  if (observerManual) return;
  setObsSource("自动定位中…", false);

  const urls = ["https://ipwho.is/", "https://ipapi.co/json/"];
  const tryNext = function(i){
    if (i >= urls.length){
      if (!observerManual) setObsSource("默认（自动定位未成功）", true);
      return;
    }
    if (observerManual) return;
    fetchJSON(urls[i], 3000).then(function(d){
      const lat = d ? Number(d.latitude) : NaN;
      const lon = d ? Number(d.longitude) : NaN;
      const refused = !d || d.success === false || d.error === true;
      const ok = !refused
              && Number.isFinite(lat) && Number.isFinite(lon)
              && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
      if (!ok){ tryNext(i + 1); return; }
      if (observerManual) return;                       // 这期间你手填了，就让给你
      applyObserverLocation(lat, lon, d.city ? "自动 · " + d.city : "自动");
    });
  };
  tryNext(0);
}

/* ============================================================
   交互：播放 / 拖动 / 变速 / 键盘 / 悬停
   ============================================================ */
let rafId = 0, prevTs = 0;
function tick(ts){
  if (!state.playing) return;
  if (!prevTs) prevTs = ts;
  const dt = (ts - prevTs) / 1000;
  prevTs = ts;
  state.now += dt * state.speed;
  if (state.now > MAX_T) state.now = MIN_T;
  paint();
  rafId = requestAnimationFrame(tick);
}

el.play.addEventListener("click", function(){
  state.playing = !state.playing;
  state.live = false;              // 一按播放就交给倍速，不再跟真实时间
  clearTimeout(liveTimer);
  el.play.textContent = state.playing ? "❚❚ 暂停" : "▶ 播放";
  if (state.playing){ prevTs = 0; rafId = requestAnimationFrame(tick); }
  else cancelAnimationFrame(rafId);   // 暂停就停在暂停那一刻，再点「现在」才回到实时
});

/* 钉住的是下面那条控件条，读数卡始终显示。
   钉住：控件条常驻。不钉住：鼠标停手 2.5 秒就滑下去，画面让给整张图；一动鼠标就回来。
   收起时画布同时铺满整屏，所以收放都要重算一次位图。 */
let pinned = false, hideTimer = 0, overBar = false;

function setBarHidden(hidden){
  if (document.body.classList.contains("bar-hidden") === hidden) return;
  document.body.classList.toggle("bar-hidden", hidden);
  // 这里刻意不调 sizeCanvas / paint：画布尺寸和图的比例都没变，
  //   变化的只是"控件条压着的那条天空露不露出来"。重算反而会让整张图跳一下。
}
// 鼠标停在条上、或焦点在输入框里，都不算"手停了"。
//   否则点进经纬度框之后不动鼠标，2.5 秒一到条就滑走，框也跟着看不见了。
function barBusy(){
  if (overBar) return true;
  const a = document.activeElement;
  return !!(a && a.tagName === "INPUT" && a.closest && a.closest(".ui"));
}
function scheduleHide(){
  clearTimeout(hideTimer);
  if (pinned || barBusy()) return;
  hideTimer = setTimeout(function(){ setBarHidden(true); }, 2500);
}
el.pin.addEventListener("click", function(){
  pinned = !pinned;
  el.pin.classList.toggle("on", pinned);
  if (pinned){ clearTimeout(hideTimer); setBarHidden(false); }
  else scheduleHide();
});
document.addEventListener("mousemove", function(){
  if (pinned) return;
  setBarHidden(false);
  scheduleHide();
});

// 进条不倒数、出条才倒数；输入框拿到焦点期间一律不倒数，交出焦点再重新计时
const uiEl = document.querySelector(".ui");
uiEl.addEventListener("mouseenter", function(){ overBar = true;  clearTimeout(hideTimer); });
uiEl.addEventListener("mouseleave", function(){ overBar = false; scheduleHide(); });
uiEl.addEventListener("focusin",  function(){ clearTimeout(hideTimer); });
uiEl.addEventListener("focusout", function(){ scheduleHide(); });

el.now.addEventListener("click", function(){
  state.playing = false;
  el.play.textContent = "▶ 播放";
  cancelAnimationFrame(rafId);
  const t = Date.now() / 1000;
  updateWindow(t);
  state.now = clamp(t, MIN_T, MAX_T);
  state.live = true;               // 「现在」= 回到实时
  paint();
  scheduleLive();
});

el.scrub.addEventListener("input", function(){
  state.playing = false;
  state.live = false;              // 手动拖过就退出实时，别被 30 秒后那一下拽回去
  clearTimeout(liveTimer);
  el.play.textContent = "▶ 播放";
  cancelAnimationFrame(rafId);
  state.now = Number(el.scrub.value);
  paint();
});

/* 播放速度：1 秒屏幕对应多少分钟数据，数值越小越慢 */
const speedBtns = document.querySelectorAll(".spd-b");
function markSpeed(){
  for (let i = 0; i < speedBtns.length; i++){
    speedBtns[i].classList.toggle("on",
      Number(speedBtns[i].dataset.s) === state.speed);
  }
}
for (let i = 0; i < speedBtns.length; i++){
  speedBtns[i].addEventListener("click", function(){
    state.speed = Number(this.dataset.s);
    prevTs = 0;          // 改速度后重算帧间隔，免得第一帧跳一大步
    markSpeed();
  });
}
markSpeed();

window.addEventListener("keydown", function(e){
  // 焦点在输入框里时不要抢左右键：那是用来移光标的，不是用来拖时间的。
  //   e.target 可能是 document（没有 closest），所以先判方法在不在
  if (e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    // 左右键也算"手动调时间"：退出实时，否则下一次整点会把画面拽回现在
    state.live = false;
    clearTimeout(liveTimer);
    state.now = clamp(state.now + (e.key === "ArrowLeft" ? -600 : 600), MIN_T, MAX_T);
    paint();
  }
});

/* 控件不再自动淡出：这是一块长期挂着的看板，随时可能要点一下（现在、拖动条、速度），
   先晃鼠标才能操作反而是多一道手续。所以底栏两行常驻，只留一道细线把它和读数分开。 */

/* 悬停提示整块去掉了：看板上不该有"把鼠标凑上去才给的信息"。
   原来提示里的三项——状态、高度角、直射经度——现在都常驻在底栏读数行里。 */

/* ============================================================
   启动
   ============================================================ */
(function init(){
  syncObsInputs();
  setObsSource("默认", true);

  // ?t=<Unix秒> 可把画面定格在某一刻，方便截图或分享；写坏了就退回"现在"
  //   给了有效的 t 就关掉实时（定格是刻意的），没给就跟着真实时间走
  const arg = new URLSearchParams(location.search).get("t");
  const t = arg === null ? NaN : Number(arg);
  if (Number.isFinite(t)) updateWindow(t);
  state.now = clamp(Number.isFinite(t) ? t : Date.now() / 1000, MIN_T, MAX_T);
  state.live = !Number.isFinite(t);

  sizeCanvas();   // 先按实际显示宽度定好位图，再画这一帧（只画一次）
  paint();
  scheduleLive(); // 实时模式下，下一个 :00 / :30 整点再算一帧

  locateByIP();   // 后台问一次；问到就换，问不到就留在默认
})();

// 窗口尺寸变化：位图密度和显示宽度都得重定，否则换屏或拉伸后会发虚、错位
window.addEventListener("resize", function(){
  sizeCanvas();
  paint();
});

/* ============================================================
   自检：按 F12 打开控制台能看到这几行。全部是可手算核对的量，
   不依赖任何外部数据表；不想看可以整段删掉
   ============================================================ */
(function selfCheck(){
  const sunJune = jdOf(Date.UTC(2026, 5, 21, 12) / 1000);
  const sunDec  = jdOf(Date.UTC(2026, 11, 21, 12) / 1000);
  console.info("[自检] GMST @ J2000 = " + gmstDeg(2451545.0).toFixed(4) + "°（应 ≈ 280.4606）");
  console.info("[自检] 夏至太阳赤纬 = " + decOf(sunJune, true).toFixed(3) + "°（应 ≈ +23.44）");
  console.info("[自检] 冬至太阳赤纬 = " + decOf(sunDec, true).toFixed(3) + "°（应 ≈ −23.44）");

  // 恒等式：λ = 赤经 − 恒星时 时，本地时角 OBS − λ 必须等于 gmst + OBS − 赤经
  const t = Date.now() / 1000, jd = jdOf(t);
  const H1 = mod360(gmstDeg(jd) + OBSERVER.lon - sunRa(jd));
  const H2 = mod360(OBSERVER.lon - bodyLon(t, true));
  const dH = Math.abs(mod360(H1 - H2 + 180) - 180);
  console.info("[自检] 时角两种算法的差 = " + dH.toExponential(2) + "°（应 ≈ 0）");
})();
</script>
