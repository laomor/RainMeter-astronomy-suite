; =================================
; METERS Timeline
; =================================

[MeterSunLabel]
Meter=String
MeterStyle=StyleCenterText
X=390
Y=16
W=10
H=10
Text=S
MouseOverAction=[!HideMeterGroup "MoonEvent"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "MoonEvent"][!Redraw]

[MeterMoonLabel]
Meter=String
MeterStyle=StyleCenterText
X=402
Y=16
W=10
H=10
Text=M
MouseOverAction=[!HideMeterGroup "SunEvent"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "SunEvent"][!Redraw]

;Container
[MeterTimelineContainer]
Meter=Image
X=[MeasureContainerX]
Y=[MeasureContainerY]
W=[MeasureContainerW]
H=[MeasureContainerH]
;Hidden=1
SolidColor=255,255,255,255
DynamicVariables=1

;Horizon Position
[HorizonLine]
Meter=Image
X=0
Y=[MeasureHorizonY]
W=[MeasureContainerW]
H=1
SolidColor=#HorizonColor#
Container=MeterTimelineContainer
DynamicVariables=1

;Celestial body label
[MeterSunTitle]
Meter=String
MeterStyle=StyleLeftText
FontColor=255,255,255,160
FontSize=7
X=10
Y=[MeasureContainerY]
W=11
H=10
Text=S:
Group=SunEvent
DynamicVariables=1

[MeterMoonTitle]
Meter=String
MeterStyle=StyleLeftText
FontColor=255,255,255,160
FontSize=7
X=10
Y=(#SkinHeight#-23)
W=11
H=10
Text=M:
Group=MoonEvent
DynamicVariables=1

;The ascending and descending states of celestial bodies
[MeterSunState]
Meter=String
MeterStyle=StyleRightText
MeasureName=SunState
FontColor=255,255,255,160
FontSize=7
X=(#SkinWidth#-10)
Y=[MeasureContainerY]
W=11
H=10
Text=%1
Group=SunEvent
DynamicVariables=1

[MeterMoonState]
Meter=String
MeterStyle=StyleRightText
MeasureName=MoonState
FontColor=255,255,255,160
FontSize=7
X=(#SkinWidth#-10)
Y=(#SkinHeight#-23)
W=11
H=10
Text=%1
Group=MoonEvent
DynamicVariables=1

