[MeterSunEvent1]
Meter=Image
ImageName=#Mark#
ImageTint=#SunEventColor#
X=([MeasureSunEvent1]-3)
Y=([MeasureHorizonY]-3)
W=7
H=7
Container=MeterTimelineContainer
