;Expired event reminder
[MeasureSunEvent1Color]
Measure=Calc
Formula=([MeasureSunEvent1] < 15 ? 1 : 2)
IfCondition=(MeasureSunEvent1Color = 1)
IfTrueAction=[!SetVariable SunEvent1Color "255,255,255,72"]
IfFalseAction=[!SetVariable SunEvent1Color "255,255,255,128"]
DynamicVariables=1
UpdateDivider=1

[MeasureMoonEvent1Color]
Measure=Calc
Formula=([MeasureMoonEvent1] < 15 ? 1 : 2)
IfCondition=(MeasureMoonEvent1Color = 1)
IfTrueAction=[!SetVariable MoonEvent1Color "255,255,255,72"]
IfFalseAction=[!SetVariable MoonEvent1Color "255,255,255,128"]
DynamicVariables=1
UpdateDivider=1

; =================================
; METERS
; =================================

[MeterClock]
Meter=String
MeterStyle=StyleTitle
MeasureName=MeasureTime
X=210
Y=12
W=180
H=18
Text=%1

[MeterDay]
Meter=String
MeterStyle=StyleLeftText
MeasureName=MeasureDay
FontColor=255,31,15,205
X=10
Y=40
W=190
H=14
Text=%1

[MeterDate]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MeasureDate
FontColor=255,255,255,205
X=280
Y=16
W=190
H=14
Text=%1

