[Rainmeter]
Update=1000
Background=#@#Background_double.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=Clock
Author=YourName
Information=Displays the current date and time.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
;<<Celestial Icon>>
Mark=#@#Tracker_mark.png
SunIcon=#@#Tracker_sun.png
MoonIcon=#@#Tracker_moon.png
fontName=Trebuchet MS
colorText=255,255,255,205
colorBar=235,170,0,255
textSize=8

;<<Skin height>>  <<Icon size>>  <<Celestial icon size>>
SkinWidth=420
SkinHeight=128
IconSize=11

;<<Container Parameters>>
ContainerX=22
ContainerY=59
ContainerW=374
ContainerH=55

;<<Horizon Color>>
HorizonColor=128,128,128,128

;<<Celestial body color>>
SunColor=255,215,0,255
MoonColor=30,144,255,255
 
;<<Event marker color>>
SunEventColor=255,215,0,160
MoonEventColor=30,144,255,160

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=255,255,255,205
FontFace=Trebuchet MS
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,128
FontFace=Trebuchet MS
FontSize=8
AntiAlias=1
ClipString=1

[StyleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleSeperator]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,36

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%d.%m.%Y

[MeasureDay]
Measure=Time
Format=%W

[MeasureWeekScroller]
Measure=Script
ScriptFile=#CURRENTPATH#WeekScroller.lua
UpdateDivider=60
CurrentTimePosition=47
dayWidth=180
DateFormat=%B - %e     %A__%w

[MeasureTimeline]
Measure=Script
ScriptFile=#CURRENTPATH#Timeline.lua
UpdateDivider=60
SunFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
MoonFile=C:\Users\Public\Documents\Rainmeter Data\MoonTimeStampEvent.txt

;<<Icon size>>
IconSize=#IconSize#

;<<Container Parameters>>
ContainerX=#ContainerX#
ContainerY=#ContainerY#
ContainerW=#ContainerW#
ContainerH=#ContainerH#

;<<The number of seconds represented by each pixel>>
SecondPerPixel=480
;<<Time offset in pixels from timeline start to current time (default 24 = 6 hours at 900 sec/pixel)>>
TimeOffsetInPixels=55

; =================================
; MEASURES WeekScroller
; =================================

[MeasureCurrentTimePosition]
Measure=String
String=[MeasureWeekScroller:GetCurrentTimePosition()]
DynamicVariables=1

[MeasureDay1X]
Measure=String
String=[MeasureWeekScroller:GetDay1X()]
DynamicVariables=1

[MeasureDay2X]
Measure=String
String=[MeasureWeekScroller:GetDay2X()]
DynamicVariables=1

[MeasureDay3X]
Measure=String
String=[MeasureWeekScroller:GetDay3X()]
DynamicVariables=1

[MeasureDay4X]
Measure=String
String=[MeasureWeekScroller:GetDay4X()]
DynamicVariables=1

[MeasureDay5X]
Measure=String
String=[MeasureWeekScroller:GetDay5X()]
DynamicVariables=1

[MeasureDay1Text]
Measure=String
String=[MeasureWeekScroller:GetDay1Text()]
DynamicVariables=1

[MeasureDay2Text]
Measure=String
String=[MeasureWeekScroller:GetDay2Text()]
DynamicVariables=1

[MeasureDay3Text]
Measure=String
String=[MeasureWeekScroller:GetDay3Text()]
DynamicVariables=1

[MeasureDay4Text]
Measure=String
String=[MeasureWeekScroller:GetDay4Text()]
DynamicVariables=1

[MeasureDay5Text]
Measure=String
String=[MeasureWeekScroller:GetDay5Text()]
DynamicVariables=1

