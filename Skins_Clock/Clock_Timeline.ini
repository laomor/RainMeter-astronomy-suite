; =================================
; METER The positions of the sun and moon
; =================================

[MeterSun]
Meter=Image
ImageName=#SunIcon#
ImageTint=#SunColor#
X=([MeasureSunX]-(#IconSize#-1)/2)
Y=([MeasureSunY]-(#IconSize#-1)/2)
W=#IconSize#
H=#IconSize#
Container=MeterContainer
Group=SunEvent
DynamicVariables=1

[MeterMoon]
Meter=Image
ImageName=#MoonIcon#
