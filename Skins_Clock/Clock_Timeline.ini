[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=Clock
Author=YourName
Information=Displays the current date and time.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
;<<Celestial Icon>>
Mark=#@#Tracker_mark.png
SunIcon=#@#Tracker_sun.png
MoonIcon=#@#Tracker_moon.png
fontName=Trebuchet MS
colorText=255,255,255,205
colorBar=235,170,0,255
textSize=8

;<<Skin height>>  < <Icon size>>  <<Celestial icon size>>
SkinWidth=210
SkinHeight=128
IconSize=13

;<<Container Parameters>>
ContainerX=22
ContainerY=59
ContainerW=164
ContainerH=55

;<<Horizon Color>>
HorizonColor=128,128,128,128

;<<Celestial body color>>
SunColor=255,215,0,255
MoonColor=30,144,255,255
 
;<<Event marker color>>
SunEventColor=255,215,0,160
MoonEventColor=30,144,255,160

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=255,255,255,205
FontFace=Trebuchet MS
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,128
FontFace=Trebuchet MS
FontSize=8
AntiAlias=1
ClipString=1

[StyleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleSeperator]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,36

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%d.%m.%Y

[MeasureDay]
Measure=Time
Format=%W   %A~%w

[MeasureLua]
Measure=Script
ScriptFile=#CURRENTPATH#Timeline.lua
UpdateDivider=60
SunFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
MoonFile=C:\Users\Public\Documents\Rainmeter Data\MoonTimeStampEvent.txt

;<<Icon size>>
IconSize=#IconSize#

;<<Container Parameters>>
ContainerX=#ContainerX#
ContainerY=#ContainerY#
ContainerW=#ContainerW#
ContainerH=#ContainerH#

;<<The number of seconds represented by each pixel>>
SecondPerPixel=1080
;<<Time offset in pixels from timeline start to current time (default 24 = 6 hours at 900 sec/pixel)>>
TimeOffsetInPixels=26

; =================================
; MEASURES Container
; =================================

[MeasureContainerX]
Measure=String
String=[MeasureLua:GetContainerX()]
DynamicVariables=1

[MeasureContainerY]
Measure=String
String=[MeasureLua:GetContainerY()]
DynamicVariables=1

[MeasureContainerW]
Measure=String
String=[MeasureLua:GetContainerW()]
DynamicVariables=1

[MeasureContainerH]
Measure=String
String=[MeasureLua:GetContainerH()]
DynamicVariables=1

; =================================
; MEASURES Horizon and Celestial Position
; =================================

[MeasureHorizonY]
Measure=String
String=[MeasureLua:GetHorizonY()]
DynamicVariables=1

; =================================
; MEASURES Sun and Moon Position and Status
; =================================

[MeasureSunX]
Measure=String
String=[MeasureLua:GetSunX()]
DynamicVariables=1

[MeasureSunY]
Measure=String
String=[MeasureLua:GetSunY()]
DynamicVariables=1

[MeasureMoonX]
Measure=String
String=[MeasureLua:GetMoonX()]
DynamicVariables=1

[MeasureMoonY]
Measure=String
String=[MeasureLua:GetMoonY()]
DynamicVariables=1

[SunState]
Measure=String
String=[MeasureLua:GetSunState()]
DynamicVariables=1

[MoonState]
Measure=String
String=[MeasureLua:GetMoonState()]
DynamicVariables=1

; =================================
; MEASURES Sun and Moon Rise and Fall Events
; =================================

[MeasureSunEvent1]
Measure=String
String=[MeasureLua:GetSunEvent1()]
DynamicVariables=1

[MeasureSunEvent2]
Measure=String
String=[MeasureLua:GetSunEvent2()]
DynamicVariables=1

[MeasureSunEvent3]
Measure=String
String=[MeasureLua:GetSunEvent3()]
DynamicVariables=1

[MeasureSunEvent4]
Measure=String
String=[MeasureLua:GetSunEvent4()]
DynamicVariables=1

[MeasureSunEvent5]
Measure=String
String=[MeasureLua:GetSunEvent5()]
DynamicVariables=1

[MeasureMoonEvent1]
Measure=String
String=[MeasureLua:GetMoonEvent1()]
DynamicVariables=1

[MeasureMoonEvent2]
Measure=String
String=[MeasureLua:GetMoonEvent2()]
DynamicVariables=1

[MeasureMoonEvent3]
Measure=String
String=[MeasureLua:GetMoonEvent3()]
DynamicVariables=1

[MeasureMoonEvent4]
Measure=String
String=[MeasureLua:GetMoonEvent4()]
DynamicVariables=1

[MeasureMoonEvent5]
Measure=String
String=[MeasureLua:GetMoonEvent5()]
DynamicVariables=1

[MeasureSunEventTime1]
Measure=String
String=[MeasureLua:GetSunEventTime1()]
DynamicVariables=1

[MeasureSunEventTime2]
Measure=String
String=[MeasureLua:GetSunEventTime2()]
DynamicVariables=1

[MeasureSunEventTime3]
Measure=String
String=[MeasureLua:GetSunEventTime3()]
DynamicVariables=1

[MeasureSunEventTime4]
Measure=String
String=[MeasureLua:GetSunEventTime4()]
DynamicVariables=1

[MeasureSunEventTime5]
Measure=String
String=[MeasureLua:GetSunEventTime5()]
DynamicVariables=1

[MeasureMoonEventTime1]
Measure=String
String=[MeasureLua:GetMoonEventTime1()]
DynamicVariables=1

[MeasureMoonEventTime2]
Measure=String
String=[MeasureLua:GetMoonEventTime2()]
DynamicVariables=1

[MeasureMoonEventTime3]
Measure=String
String=[MeasureLua:GetMoonEventTime3()]
DynamicVariables=1

[MeasureMoonEventTime4]
Measure=String
String=[MeasureLua:GetMoonEventTime4()]
DynamicVariables=1

[MeasureMoonEventTime5]
Measure=String
String=[MeasureLua:GetMoonEventTime5()]
DynamicVariables=1

; =================================
; METER Title
; =================================

[MeterClock]
Meter=String
MeterStyle=StyleTitle
MeasureName=MeasureTime
X=105
Y=12
W=180
H=18
Text=%1

[MeterDay]
Meter=String
MeterStyle=StyleLeftText
MeasureName=MeasureDay
X=10
Y=40
W=190
H=14
Text=%1

[MeterDate]
Meter=String
MeterStyle=StyleRightText
MeasureName=MeasureDate
X=200
Y=0r
W=190
H=14
Text=%1

[MeterSeperator]
Meter=Image
MeterStyle=StyleSeperator
X=10
Y=52
W=190
H=1

[MeterSunLabel]
Meter=String
MeterStyle=StyleCenterText
X=180
Y=16
W=10
H=10
Text=S
MouseOverAction=[!HideMeterGroup "MoonEvent"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "MoonEvent"][!Redraw]

[MeterMoonLabel]
Meter=String
MeterStyle=StyleCenterText
X=192
Y=16
W=10
H=10
Text=M
MouseOverAction=[!HideMeterGroup "SunEvent"][!Redraw]
MouseLeaveAction=[!ShowMeterGroup "SunEvent"][!Redraw]

; =================================
; METER Container and Horizon
; =================================

[MeterContainer]
Meter=Image
X=[MeasureContainerX]
Y=[MeasureContainerY]
W=[MeasureContainerW]
H=[MeasureContainerH]
;Hidden=1
SolidColor=255,255,255,255
DynamicVariables=1

[HorizonLine]
Meter=Image
X=0
Y=[MeasureHorizonY]
W=[MeasureContainerW]
H=1
SolidColor=#HorizonColor#
Container=MeterContainer
DynamicVariables=1

; =================================
; METER The state of the sun and moon
; =================================

[MeterSunTitle]
Meter=String
MeterStyle=StyleLeftText
FontColor=255,255,255,160
FontSize=7
X=10
Y=[MeasureContainerY]
W=11
H=10
Text=S:
Group=SunEvent
DynamicVariables=1

[MeterMoonTitle]
Meter=String
MeterStyle=StyleLeftText
FontColor=255,255,255,160
FontSize=7
X=10
Y=(#SkinHeight#-23)
W=11
H=10
Text=M:
Group=MoonEvent
DynamicVariables=1

[MeterSunState]
Meter=String
MeterStyle=StyleRightText
MeasureName=SunState
FontColor=255,255,255,160
FontSize=7
X=(#SkinWidth#-10)
Y=[MeasureContainerY]
W=11
H=10
Text=%1
Group=SunEvent
DynamicVariables=1

[MeterMoonState]
Meter=String
MeterStyle=StyleRightText
MeasureName=MoonState
FontColor=255,255,255,160
FontSize=7
X=(#SkinWidth#-10)
Y=(#SkinHeight#-23)
W=11
H=10
Text=%1
Group=MoonEvent
DynamicVariables=1

