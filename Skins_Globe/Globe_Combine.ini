[Rainmeter]
Update=1000
Background=#@#Background_double.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=EarthRotation
Author=YourName
Information=Simulate the real-time rotation of the Earth.
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
ImagePath=#@#Globe\
fontName=Trebuchet MS
colorText=255,255,255,205
colorBar=235,170,0,255
SkinWidth=420
SkinHeight=344
textSize=8

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[StyleSeperator]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,36

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%Y-%m-%d %H:%M:%S
UpdateDivider=1

[MeasureLua]
Measure=Script
ScriptFile=#@#Globe_Combine.lua
UpdateDivider=60
SunFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
MoonFile=C:\Users\Public\Documents\Rainmeter Data\MoonTimeStampEvent.txt
LocalLongitude=114

[MeasureTimeStatus]
Measure=String
String=[MeasureLua:GetTimeStatus()]
DynamicVariables=1

[MeasureSunEarthImage]
Measure=String
String=[&MeasureLua:GetSunEarthImage()]
DynamicVariables=1
UpdateDivider=10
RegExpSubstitute=1
Substitute="^(\d+)$":"globe_\1","^(\d{1,2})$":"globe_00\1","^(\d{1,3})$":"globe_\1","^globe_(\d{1})$":"globe_00\1","^globe_(\d{2})$":"globe_0\1"

[MeasureMoonEarthImage]
Measure=String
String=[&MeasureLua:GetMoonEarthImage()]
DynamicVariables=1
UpdateDivider=10
RegExpSubstitute=1
Substitute="^(\d+)$":"globe_\1","^(\d{1,2})$":"globe_00\1","^(\d{1,3})$":"globe_\1","^globe_(\d{1})$":"globe_00\1","^globe_(\d{2})$":"globe_0\1"

[MeasureSunTimeRatioT]
Measure=String
String=[MeasureLua:GetCurrentSunTimeRatioT()]
DynamicVariables=1
NumOfDecimals=3

[MeasureMoonTimeRatioT]
Measure=String
String=[MeasureLua:GetCurrentMoonTimeRatioT()]
DynamicVariables=1
NumOfDecimals=3

[MeasureSunLongitude]
Measure=String
String=[MeasureLua:GetCurrentSunLongitude()]
DynamicVariables=1
NumOfDecimals=1

[MeasureMoonLongitude]
Measure=String
String=[MeasureLua:GetCurrentMoonLongitude()]
DynamicVariables=1
NumOfDecimals=1

[MeasureLocalLongitude]
Measure=String
String=[MeasureLua:GetLocalLongitude()]
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=210
Y=12
W=190
H=18
Text="Earth Rotation"

[MeterSunImage]
Meter=Image
ImageName=#ImagePath#[MeasureSunEarthImage].png
X=20
Y=80
W=180
H=180
ToolTipText="[MeasureTimeStatus] : [MeasureSunEarthImage]"
PreserveAspectRatio=1
DynamicVariables=1
AntiAlias=1

[MeterMoonImage]
Meter=Image
ImageName=#ImagePath#[MeasureMoonEarthImage].png
X=220
Y=80
W=180
H=180
ToolTipText="[MeasureTimeStatus] : [MeasureMoonEarthImage]"
PreserveAspectRatio=1
DynamicVariables=1
AntiAlias=1

[MeterInformation]
Meter=String
MeterStyle=StyleRightText
X=410
Y=(#SkinHeight#-36)
W=380
H=14
Text="Sun:[MeasureSunLongitude]  Moon:[MeasureMoonLongitude]  Local:[MeasureLocalLongitude]"
DynamicVariables=1

[MeterStateTBar]
Meter=bar
MeterStyle=StyleSeperator
MeasureName=MeasureSunTimeRatioT
X=10
Y=(#SkinHeight#-15)
W=400
H=1

[MeterClickArea]
Meter=Image
X=10
Y=39
W=400
H=(#SkinHeight#-53)
SolidColor=0,0,0,1
LeftMouseUpAction=[!Refresh]
DynamicVariables=1
