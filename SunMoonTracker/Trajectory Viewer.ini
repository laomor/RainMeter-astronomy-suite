[Rainmeter]
Update=1000
Background=#@#Background_double.png
BackgroundMode=3
BackgroundMargins=10,34,10,14
DynamicWindowSize=1

[Metadata]
Name=SunMoonTracker
Author=Your Name
Information=The motion trajectory of the model sun and moon.
License=Creative Commons BY-NC-SA 3.0
Version=6.0

[Variables]
;<<Celestial Icon>>
Mark=#@#Tracker_mark.png
SunIcon=#@#Tracker_sun.png
MoonIcon=#@#Tracker_moon.png

;<<Celestial icon size>>
IconSize=21

;<<Horizon Color>>
HorizonColor=128,128,128,128

;<<Celestial body color>>
SunColor=255,215,0,255
MoonColor=30,144,255,255 

;<<Event marker color>>
SunRiseColor=255,215,0,180
SunSetColor=255,215,0,150
MoonRiseColor=30,144,255,180
MoonSetColor=30,144,255,150

; =================================
; STYLES
; =================================

[StyleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=255,255,255,205
FontFace=Trebuchet MS
FontSize=10
AntiAlias=1
ClipString=1

[StyleCenterText]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,160
FontFace=Trebuchet MS
FontSize=8
AntiAlias=1
ClipString=1

; =================================
; MEASURES
; =================================

[MeasureTime]
Measure=Time
Format=%Y%m%d%H%M
UpdateDivider=1

[MeasureLua]
Measure=Script
ScriptFile=#@#Trajectory Viewer.lua
UpdateDivider=60
SunFile=C:\Users\Public\Documents\Rainmeter Data\SunTimeStampEvent.txt
MoonFile=C:\Users\Public\Documents\Rainmeter Data\MoonTimeStampEvent.txt

;<<Skin height>>  <<Icon size>>
SkinWidth=420
SkinHeight=256
IconSize=#IconSize#

;<<Optional: override default container height>>
;ContainerH=55

;<<Timeline length>> 
Length=360
;<<The number of seconds represented by each pixel>>
SecondPerPixel=240

;<<The height difference (in pixels) between the dynamic high and low points of day and night duration and the reference point>>
OffsetValue=15

; =================================
; MEASURES
; =================================

[MeasureContainerX]
Measure=String
String=[MeasureLua:GetContainerX()]
DynamicVariables=1

[MeasureContainerY]
Measure=String
String=[MeasureLua:GetContainerY()]
DynamicVariables=1

[MeasureContainerW]
Measure=String
String=[MeasureLua:GetContainerW()]
DynamicVariables=1

[MeasureContainerH]
Measure=String
String=[MeasureLua:GetContainerH()]
DynamicVariables=1

; =================================
; MEASURES
; =================================

[MeasureHorizonY]
Measure=String
String=[MeasureLua:GetHorizonY()]
DynamicVariables=1

[MeasureXAxisStart]
Measure=String
String=[MeasureLua:GetXAxisStart()]
DynamicVariables=1

[MeasureLength]
Measure=String
String=[MeasureLua:GetLength()]
DynamicVariables=1

; =================================
; MEASURES
; =================================

[MeasureSunX]
Measure=String
String=[MeasureLua:GetSunX()]
DynamicVariables=1

[MeasureSunY]
Measure=String
String=[MeasureLua:GetSunY()]
DynamicVariables=1

[MeasureMoonX]
Measure=String
String=[MeasureLua:GetMoonX()]
DynamicVariables=1

[MeasureMoonY]
Measure=String
String=[MeasureLua:GetMoonY()]
DynamicVariables=1

[SunState]
Measure=String
String=[MeasureLua:GetSunState()]
DynamicVariables=1

[MoonState]
Measure=String
String=[MeasureLua:GetMoonState()]
DynamicVariables=1t

; =================================
; MEASURES
; =================================

[MeasureSunrise]
Measure=String
String=[MeasureLua:GetTodaySunrise()]
DynamicVariables=1

[MeasureSunset]
Measure=String
String=[MeasureLua:GetTodaySunset()]
DynamicVariables=1

[MeasureMoonrise]
Measure=String
String=[MeasureLua:GetTodayMoonrise()]
DynamicVariables=1

[MeasureMoonset]
Measure=String
String=[MeasureLua:GetTodayMoonset()]
DynamicVariables=1

[MeasureSunriseTime]
Measure=String
String=[MeasureLua:GetTodaySunriseTime()]
DynamicVariables=1

[MeasureSunsetTime]
Measure=String
String= [MeasureLua:GetTodaySunsetTime()]
DynamicVariables=1

[MeasureMoonriseTime]
Measure=String
String=[MeasureLua:GetTodayMoonriseTime()]
DynamicVariables=1

[MeasureMoonsetTime]
Measure=String
String=[MeasureLua:GetTodayMoonsetTime()]
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=210
Y=12
W=180
H=18
Text="Sun Moon Tracker"

; =================================
; METERS
; =================================

[MeterContainer]
Meter=Image
X=[MeasureContainerX]
Y=[MeasureContainerY]
W=[MeasureContainerW]
H=[MeasureContainerH]
SolidColor=255,255,255,255
DynamicVariables=1

[HorizonLine]
Meter=Image
X=([MeasureXAxisStart]-(#IconSize#-1)/2)
Y=[MeasureHorizonY]
W=([MeasureLength]+(#IconSize#-1))
H=1
SolidColor=#HorizonColor#
Container=MeterContainer
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterSun]
Meter=Image
ImageName=#SunIcon#
ImageTint=#SunColor#
X=([MeasureSunX]-(#IconSize#-1)/2)
Y=([MeasureSunY]-(#IconSize#-1)/2)
W=#IconSize#
H=#IconSize#
Container=MeterContainer
DynamicVariables=1
MouseOverAction=[!ShowMeterGroup "SunTimes"][!Redraw]
MouseLeaveAction=[!HideMeterGroup "SunTimes"][!Redraw]

[MeterMoon]
Meter=Image
ImageName=#MoonIcon#
ImageTint=#MoonColor#
X=([MeasureMoonX]-(#IconSize#-1)/2)
Y=([MeasureMoonY]-(#IconSize#-1)/2)
W=#IconSize#
H=#IconSize#
Container=MeterContainer
DynamicVariables=1
MouseOverAction=[!ShowMeterGroup "MoonTimes"][!Redraw]
MouseLeaveAction=[!HideMeterGroup "MoonTimes"][!Redraw]

[MeterSunState]
Meter=String
MeterStyle=StyleCenterText
MeasureName=SunState
X=([MeasureXAxisStart]+[MeasureLength])
Y=0
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=SunTimes
DynamicVariables=1

[MeterMoonState]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MoonState
X=([MeasureXAxisStart]+[MeasureLength])
Y=0
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=MoonTimes
DynamicVariables=1

; =================================
; METERS
; =================================

[MeterSunrise]
Meter=Image
ImageName=#Mark#
ImageTint=#SunRiseColor#
X=([MeasureSunrise]-5)
Y=([MeasureHorizonY]-5)
W=11
H=11
Container=MeterContainer
DynamicVariables=1
Hidden=([MeasureSunrise] = 0)

[SunriseTime]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MeasureSunriseTime
X=[MeasureSunrise]
Y=([MeasureContainerH]-10)
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=SunTimes
DynamicVariables=1

[MeterSunset]
Meter=Image
ImageName=#Mark#
ImageTint=#SunSetColor#
X=([MeasureSunset]-5)
Y=([MeasureHorizonY]-5)
W=11
H=11
Container=MeterContainer
DynamicVariables=1
Hidden=([MeasureSunset] = 0)

[SunsetTime]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MeasureSunsetTime
X=[MeasureSunset]
Y=([MeasureContainerH]-10)
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=SunTimes
DynamicVariables=1

[MeterMoonrise]
Meter=Image
ImageName=#Mark#
ImageTint=#MoonRiseColor#
X=([MeasureMoonrise]-5)
Y=([MeasureHorizonY]-5)
W=11
H=11
Container=MeterContainer
DynamicVariables=1
Hidden=([MeasureMoonrise] = 0)

[MoonriseTime]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MeasureMoonriseTime
X=[MeasureMoonrise]
Y=([MeasureContainerH]-10)
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=MoonTimes
DynamicVariables=1

[MeterMoonset]
Meter=Image
ImageName=#Mark#
ImageTint=#MoonSetColor#
X=([MeasureMoonset]-5)
Y=([MeasureHorizonY]-5)
W=11
H=11
Container=MeterContainer
DynamicVariables=1
Hidden=([MeasureMoonset] = 0)

[MoonsetTime]
Meter=String
MeterStyle=StyleCenterText
MeasureName=MeasureMoonsetTime
X=[MeasureMoonset]
Y=([MeasureContainerH]-10)
W=30
H=10
Text=%1
Hidden=1
Container=MeterContainer
Group=MoonTimes
DynamicVariables=1
